<html lang="zh-CN">

<meta charset="UTF-8">

<title>📋 小茶的学习计划</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --accent: #f5a8d0;
  --accent2: #ffb7c5;
  --accent3: #c8a8f5;
  --fg: #f0e6ef;
  --sub: rgba(255,255,255,.5);
  --surface: rgba(17, 17, 27, 0.55);
  --surface-hover: rgba(17, 17, 27, 0.7);
  --border: rgba(255,255,255,.08);
  --danger: #f38ba8;
  --green: #a6e3a1;
  --shadow: 0 8px 32px rgba(0,0,0,.4);
}

body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 12px;
  background: #1a1a2e;
  background-size: cover;
  background-position: center;
  transition: background-image 1s ease;
  position: relative;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background: linear-gradient(135deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.45) 50%,rgba(0,0,0,.75) 100%);
  z-index: 0; pointer-events: none;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(245, 168, 208, .1) 0%, transparent 70%);
  z-index: 0; pointer-events: none;
}

.container { width: 100%; max-width: 520px; position: relative; z-index: 1; }

/* ---- Header ---- */
.header { text-align: center; margin-bottom: 14px; }
.header h1 { font-size: 26px; color: var(--accent); margin-bottom: 2px; text-shadow: 0 2px 12px rgba(245,168,208,.3); }
.header .subtitle { font-size: 12px; color: var(--sub); }

/* ---- Top Card (Date + Weather + Quote) ---- */
.top-card {
  background: var(--surface); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px;
}

.top-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; font-size: 13px;
}

.date-display { color: var(--fg); font-weight: 600; }
.weather-display { color: var(--sub); }

.quote-display {
  font-size: 14px; line-height: 1.6; color: var(--accent2);
  padding: 10px 12px; background: rgba(255,255,255,.04);
  border-radius: 10px; border-left: 3px solid var(--accent);
  font-style: italic;
}

.quote-display::before { content: '"'; }
.quote-display::after { content: '"'; }

/* ---- Stats Dashboard ---- */
.stats-dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }

.stat-card {
  background: var(--surface); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 8px; text-align: center; box-shadow: var(--shadow);
}
.stat-card .stat-icon { font-size: 18px; margin-bottom: 2px; }
.stat-card .stat-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
.stat-card .stat-value { font-size: 20px; font-weight: 700; font-family: 'Consolas', monospace; }
.stat-card.today .stat-value { color: var(--accent); }
.stat-card.week .stat-value { color: var(--green); }
.stat-card.month .stat-value { color: var(--accent3); }

/* ---- Tool Bar ---- */
.tool-bar {
  display: flex; justify-content: center; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap;
}
.tool-bar button {
  font-family: inherit; font-size: 11px; padding: 5px 12px;
  border: 1px solid var(--border); border-radius: 20px; cursor: pointer;
  background: rgba(255,255,255,.08); color: var(--fg);
  backdrop-filter: blur(10px); transition: all .2s;
}
.tool-bar button:hover { background: rgba(255,255,255,.15); transform: translateY(-1px); }

/* ---- Add Form ---- */
.add-form { display: flex; gap: 8px; margin-bottom: 12px; }
.add-form input {
  flex: 1; font-family: inherit; font-size: 14px; padding: 11px 14px;
  border: 1px solid var(--border); border-radius: 12px;
  background: rgba(255,255,255,.06); color: var(--fg); outline: none;
  transition: border-color .2s; backdrop-filter: blur(10px);
}
.add-form input::placeholder { color: var(--sub); }
.add-form input:focus { border-color: var(--accent); background: rgba(255,255,255,.1); }
.add-form button {
  font-family: inherit; font-size: 14px; font-weight: 600; padding: 11px 18px;
  border: none; border-radius: 12px; cursor: pointer; background: var(--accent);
  color: #1a1a2e; transition: all .2s; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(245,168,208,.3);
}
.add-form button:hover { opacity: .9; transform: translateY(-1px); }

/* ---- Stats total bar ---- */
.stats-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; margin-bottom: 10px; font-size: 13px; color: var(--sub);
  background: var(--surface); border-radius: 12px; backdrop-filter: blur(16px);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.stats-bar .total-hours { color: var(--accent); font-weight: 700; font-size: 15px; }

/* ---- Empty State ---- */
.empty-state { text-align: center; padding: 50px 20px; color: var(--sub); }
.empty-state .icon { font-size: 42px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* ---- Item List ---- */
.item-list { display: flex; flex-direction: column; gap: 8px; }

/* ---- Item Card ---- */
.item-card {
  background: var(--surface); border-radius: 14px; padding: 14px 16px;
  border: 1px solid var(--border); backdrop-filter: blur(16px);
  box-shadow: var(--shadow); transition: all .3s;
}
.item-card:hover { background: var(--surface-hover); border-color: rgba(255,255,255,.15); }

.item-card-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
}
.item-name { font-size: 15px; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background .2s; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-name:hover { background: rgba(255,255,255,.08); }
.item-name-input { font-family: inherit; font-size: 15px; font-weight: 600; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 4px; background: rgba(0,0,0,.3); color: var(--fg); outline: none; width: 100%; }
.item-delete-btn { background: transparent; border: none; color: var(--sub); font-size: 16px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: all .2s; opacity: .4; line-height: 1; }
.item-delete-btn:hover { color: var(--danger); opacity: 1; background: rgba(243,139,168,.15); }

.item-total { text-align: center; padding: 2px 0 8px; }
.item-total .hours-big { font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
.item-total .hours-label { font-size: 12px; color: var(--sub); margin-left: 4px; }

.record-row { display: flex; align-items: center; gap: 8px; justify-content: center; border-top: 1px solid var(--border); padding-top: 10px; }
.record-row label { font-size: 12px; color: var(--sub); white-space: nowrap; }
.record-row input { width: 64px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.25); color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 600; text-align: center; outline: none; transition: border-color .2s; }
.record-row input:focus { border-color: var(--accent); }
.record-row input[type=number]::-webkit-inner-spin-button, .record-row input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.record-row input[type=number] { -moz-appearance: textfield; }
.record-row .unit { font-size: 12px; color: var(--sub); }
.record-btn { font-family: inherit; font-size: 12px; font-weight: 600; padding: 7px 16px; border: none; border-radius: 8px; cursor: pointer; background: var(--accent); color: #1a1a2e; transition: all .2s; box-shadow: 0 2px 10px rgba(245,168,208,.25); }
.record-btn:hover { opacity: .85; transform: translateY(-1px); }

/* ---- Footer ---- */
.footer { text-align: center; margin-top: 24px; padding: 16px 0 8px; }
.watermark { font-size: 12px; color: var(--sub); opacity: .3; letter-spacing: 1px; }

/* ---- Animations ---- */
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.item-card { animation: fadeIn .25s ease; }
@keyframes flash { 0%,100% { } 50% { color: var(--green); transform: scale(1.1); } }
.flash { animation: flash .5s ease; }
@keyframes statPop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
.stat-pop .stat-value { animation: statPop .4s ease; }

@media (max-width: 400px) {
  .stats-dash { gap: 6px; }
  .stat-card .stat-value { font-size: 16px; }
  .item-total .hours-big { font-size: 26px; }
}
</style>

let currentPhotoIdx = 0;

function setPhoto(index) {
  currentPhotoIdx = (index + PHOTOS.length) % PHOTOS.length;
  document.body.style.backgroundImage = `url(${PHOTOS[currentPhotoIdx]})`;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
  localStorage.setItem('study_photo_idx', currentPhotoIdx);
}
function nextPhoto() { setPhoto(currentPhotoIdx + 1); }
function prevPhoto() { setPhoto(currentPhotoIdx - 1); }
function randomPhoto() { setPhoto(Math.floor(Math.random() * PHOTOS.length)); }

// ---- Date & Quote ----
function updateDateAndQuote() {
  const now = new Date();
  const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
  document.getElementById('dateDisplay').textContent = dateStr;

  // Pick quote based on day of year so it's consistent all day
  const startOfYear = new Date(now.getFullYear(), 0, 0);
  const diff = now - startOfYear;
  const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
  document.getElementById('quoteDisplay').textContent = QUOTES[dayOfYear % QUOTES.length];
}

// ---- Weather ----
function fetchWeather() {
  const savedCity = localStorage.getItem('study_city');
  if (savedCity) {
    document.getElementById('weatherDisplay').textContent = `📍 ${savedCity}`;
  }
  // Try auto-detect city via browser geolocation → reverse geocode
  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      // Use Open-Meteo free API for weather (no API key needed)
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&timezone=auto`)
        .then(r => r.json())
        .then(data => {
          const w = data.current_weather;
          const temp = w.temperature;
          const code = w.weathercode;
          const emoji = getWeatherEmoji(code);
          document.getElementById('weatherDisplay').textContent = `${emoji} ${temp}°C`;
        })
        .catch(() => {
          // weather fetch failed, keep city display
        });
    }, () => {
      // geolocation denied, keep whatever was shown
    });
  }
}

function getWeatherEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 20) return '🌫';
  if (code <= 30) return '🌧';
  if (code <= 50) return '🌧';
  if (code <= 70) return '❄️';
  return '🌦';
}

const monthValue = $('monthValue');

function loadData() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch {}
  return [];
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function roundHours(h) { return Math.round(h * 100) / 100; }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getWeekBounds() {
  const now = new Date();
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(now.getFullYear(), now.getMonth(), diff);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return { start: mon, end: sun };
}

function getMonthBounds() {
  const now = new Date();
  return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: new Date(now.getFullYear(), now.getMonth() + 1, 0) };
}

function isDateInRange(dateStr, start, end) {
  const d = new Date(dateStr + 'T00:00:00');
  return d >= start && d <= end;
}

function getStats() {
  const today = todayStr();
  const week = getWeekBounds();
  const month = getMonthBounds();
  let dailyTotal = 0, weeklyTotal = 0, monthlyTotal = 0, grandTotal = 0;
  items.forEach(item => {
    (item.records || []).forEach(rec => {
      const h = rec.hours || 0;
      grandTotal += h;
      if (rec.date === today) dailyTotal += h;
      if (isDateInRange(rec.date, week.start, week.end)) weeklyTotal += h;
      if (isDateInRange(rec.date, month.start, month.end)) monthlyTotal += h;
    });
  });
  return { daily: roundHours(dailyTotal), weekly: roundHours(weeklyTotal), monthly: roundHours(monthlyTotal), grandTotal: roundHours(grandTotal) };
}

function getItemTotal(item) {
  return roundHours((item.records || []).reduce((s, r) => s + (r.hours || 0), 0));
}

function render() {
  const hasItems = items.length > 0;
  emptyState.style.display = hasItems ? 'none' : 'block';
  const cards = itemList.querySelectorAll('.item-card');
  cards.forEach(c => c.remove());

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.dataset.id = item.id;
    const total = getItemTotal(item);
    card.innerHTML = `
      <div class="item-card-header">
        <span class="item-name" data-id="${item.id}">${escapeHtml(item.name)}</span>
        <button class="item-delete-btn" data-id="${item.id}">✕</button>
      </div>
      <div class="item-total">
        <span class="hours-big" id="total-${item.id}">${total}</span>
        <span class="hours-label">累计分钟</span>
      </div>
      <div class="record-row">
        <label>🔖 今天学了</label>
        <input type="number" class="record-input" id="input-${item.id}" value="30" min="1" step="5" placeholder="0">
        <span class="unit">分钟</span>
        <button class="record-btn" data-id="${item.id}">✓ 记录</button>
      </div>`;
    itemList.insertBefore(card, emptyState);

    const nameSpan = card.querySelector('.item-name');
    nameSpan.addEventListener('click', () => startRename(item.id, nameSpan));
    const recBtn = card.querySelector('.record-btn');
    recBtn.addEventListener('click', () => recordTime(item.id));
    const recInput = card.querySelector('.record-input');
    recInput.addEventListener('keydown', e => { if (e.key === 'Enter') recordTime(item.id); });
    recInput.addEventListener('focus', () => recInput.select());
    const delBtn = card.querySelector('.item-delete-btn');
    delBtn.addEventListener('click', () => deleteItem(item.id));
  });
  updateAllStats();
}

function updateAllStats() {
  const stats = getStats();
  todayValue.textContent = stats.daily;
  weekValue.textContent = stats.weekly;
  monthValue.textContent = stats.monthly;
  itemCount.textContent = `共 ${items.length} 个项目`;
  totalHours.textContent = stats.grandTotal;
}

function animateStat(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('stat-pop');
  void el.offsetWidth;
  el.classList.add('stat-pop');
}

function recordTime(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const input = document.getElementById(`input-${id}`);
  const val = parseFloat(input.value);
  if (isNaN(val) || val <= 0) { input.focus(); return; }
  if (!item.records) item.records = [];
  item.records.push({ date: todayStr(), hours: val });
  saveData();
  const totalEl = document.getElementById(`total-${id}`);
  totalEl.textContent = getItemTotal(item);
  totalEl.classList.remove('flash');
  void totalEl.offsetWidth;
  totalEl.classList.add('flash');
  input.value = 1;
  input.focus();
  input.select();
  updateAllStats();
  ['statToday', 'statWeek', 'statMonth'].forEach(id => animateStat(id));
}

function startRename(id, spanEl) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'item-name-input';
  input.value = item.name; input.maxLength = 50;
  spanEl.replaceWith(input); input.focus(); input.select();
  function finish() {
    const val = input.value.trim();
    if (val) { item.name = val; saveData(); }
    spanEl.textContent = item.name;
    input.replaceWith(spanEl);
  }
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = item.name; input.blur(); }
  });
}

function deleteItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (!confirm(`确定要删除「${item.name}」吗？\n所有学习记录将被清除。`)) return;
  items = items.filter(i => i.id !== id);
  saveData();
  render();
}

function addItem() {
  const name = itemInput.value.trim();
  if (!name) { itemInput.focus(); return; }
  const item = { id: genId(), name, records: [] };
  items.push(item);
  itemInput.value = ''; itemInput.focus();
  saveData(); render();
  const newInput = document.getElementById(`input-${item.id}`);
  if (newInput) setTimeout(() => newInput.focus(), 100);
}

// ---- Events ----
itemInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
addBtn.addEventListener('click', addItem);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') nextPhoto();
  if (e.key === 'ArrowLeft') prevPhoto();
});
$('nextPhotoBtn').addEventListener('click', nextPhoto);
$('prevPhotoBtn').addEventListener('click', prevPhoto);
$('shuffleBtn').addEventListener('click', randomPhoto);
$('refreshBtn').addEventListener('click', () => {
  window.location.href = window.location.href.split('?')[0] + '?t=' + Date.now();
});

// ---- Init ----
function init() {
  const savedIdx = localStorage.getItem('study_photo_idx');
  if (savedIdx !== null) setPhoto(parseInt(savedIdx));
  else randomPhoto();

  updateDateAndQuote();
  fetchWeather();

  items = loadData();
  items.forEach(i => { if (!i.records) i.records = []; });
  render();
  itemInput.focus();
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1e1e2e;
    --bg2: #181825;
    --fg: #cdd6f4;
    --accent: #f5c2e7;
    --work: #f38ba8;
    --break: #a6e3a1;
    --long: #89b4fa;
    --btn-bg: #313244;
    --btn-hover: #45475a;
    --sub: #6c7086;
    --surface: #11111b;
  }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }

  .container {
    background: var(--surface);
    border-radius: 32px;
    padding: 40px 50px;
    width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }

  h1 {
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 20px;
  }

  .mode-label {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    transition: color .3s;
  }

  .mode-work { color: var(--work); }
  .mode-short_break { color: var(--break); }
  .mode-long_break { color: var(--long); }

  .timer-container {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 10px;
  }

  .timer-container svg {
    transform: rotate(-90deg);
    width: 260px;
    height: 260px;
  }

  .timer-bg { fill: none; stroke: var(--btn-bg); stroke-width: 8; }
  .timer-progress {
    fill: none; stroke: var(--work); stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset .5s ease, stroke .3s;
  }

  .timer-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-text .time {
    font-size: 48px;
    font-weight: bold;
    font-family: 'Consolas', monospace;
    letter-spacing: 2px;
  }

  .timer-text .phase {
    font-size: 13px;
    color: var(--sub);
    margin-top: 6px;
  }

  .pomo-count {
    font-size: 14px;
    color: var(--sub);
    margin: 8px 0 16px;
  }

  .pomo-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
    min-height: 20px;
  }

  .pomo-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--btn-bg);
    transition: all .3s;
  }

  .pomo-dot.done { background: var(--work); box-shadow: 0 0 8px var(--work); }

  .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 22px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--fg);
    transition: all .2s;
    min-width: 90px;
  }

  .btn:hover:not(:disabled) { background: var(--btn-hover); transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--work); color: var(--surface); }
  .btn-primary:hover:not(:disabled) { background: #e07a96; }

  .btn-success { background: var(--break); color: var(--surface); }
  .btn-success:hover:not(:disabled) { background: #8bcb8e; }

  .status-text {
    font-size: 13px;
    color: var(--sub);
    margin-top: 6px;
    min-height: 20px;
  }

  .separator {
    border: none;
    height: 1px;
    background: var(--btn-bg);
    margin: 18px 0 14px;
  }

  .settings h2 {
    font-size: 15px;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .setting-row label {
    font-size: 13px;
    color: var(--fg);
    white-space: nowrap;
  }

  .setting-row input {
    width: 56px;
    padding: 5px 8px;
    border: none;
    border-radius: 8px;
    background: var(--bg2);
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    text-align: center;
  }

  .setting-row input:focus { outline: 2px solid var(--accent); }

  .save-btn {
    margin-top: 12px;
    padding: 7px 28px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: var(--accent);
    color: var(--surface);
    transition: all .2s;
  }

  .save-btn:hover { opacity: .85; }

  /* 水印 */
  .watermark {
    position: fixed;
    bottom: 12px;
    right: 16px;
    font-size: 14px;
    color: var(--sub);
    opacity: .35;
    pointer-events: none;
    font-family: 'Microsoft YaHei', sans-serif;
    letter-spacing: 1px;
    z-index: 999;
  }

  /* 删除按钮 */
  .btn-skip {
    background: transparent;
    color: var(--sub);
    font-size: 12px;
    padding: 6px 14px;
    min-width: auto;
  }
  .btn-skip:hover:not(:disabled) { color: var(--fg); background: var(--btn-bg); }
</style>
</head>
<body>
<div class="container">
  <h1>🍅 番茄钟</h1>
  <p class="subtitle">专注每一刻</p>

  <div class="mode-label" id="modeLabel">🎯 专注时间</div>

  <div class="timer-container">
    <svg viewBox="0 0 260 260">
      <circle class="timer-bg" cx="130" cy="130" r="110"/>
      <circle class="timer-progress" id="progress" cx="130" cy="130" r="110"
              stroke-dasharray="691.15" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-text">
      <div class="time" id="timerDisplay">25:00</div>
      <div class="phase" id="phaseText">准备就绪</div>
    </div>
  </div>

  <div class="pomo-dots" id="pomoDots"></div>
  <div class="pomo-count" id="pomoCount">🍅 已完成 0 个番茄</div>

  <div class="btn-group">
    <button class="btn btn-primary" id="startBtn">▶ 开始</button>
    <button class="btn" id="pauseBtn" disabled>⏸ 暂停</button>
    <button class="btn" id="resetBtn">⏹ 重置</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-skip" id="skipBtn" disabled>⏭ 跳过当前阶段</button>
  </div>

  <div class="watermark">小茶</div>
  <div class="status-text" id="statusText">按下「开始」启动番茄钟</div>

  <hr class="separator">

  <div class="settings">
    <h2>⚙ 设置</h2>
    <div class="settings-grid">
      <div class="setting-row">
        <label>工作时间</label>
        <input type="number" id="sWork" min="1" value="25">
      </div>
      <div class="setting-row">
        <label>短休息</label>
        <input type="number" id="sShort" min="1" value="5">
      </div>
      <div class="setting-row">
        <label>长休息</label>
        <input type="number" id="sLong" min="1" value="15">
      </div>
      <div class="setting-row">
        <label>番茄数</label>
        <input type="number" id="sCount" min="1" value="4">
      </div>
    </div>
    <button class="save-btn" id="saveBtn">💾 保存设置</button>
  </div>
</div>

<script>
const CIRCUMFERENCE = 2 * Math.PI * 110; // 691.15

// DOM引用
const $ = id => document.getElementById(id);
const timerDisplay = $('timerDisplay');
const progress = $('progress');
const modeLabel = $('modeLabel');
const phaseText = $('phaseText');
const statusText = $('statusText');
const pomoCount = $('pomoCount');
const pomoDots = $('pomoDots');
const startBtn = $('startBtn');
const pauseBtn = $('pauseBtn');
const resetBtn = $('resetBtn');
const skipBtn = $('skipBtn');
const sWork = $('sWork');
const sShort = $('sShort');
const sLong = $('sLong');
const sCount = $('sCount');
const saveBtn = $('saveBtn');

// 配置
const STORAGE_KEY = 'pomodoro_config';
function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { work: 25, shortBreak: 5, longBreak: 15, count: 4 };
}
function saveConfig(c) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(c));
}
let config = loadConfig();

// 状态
let state = 'idle'; // idle | running | paused
let mode = 'work';  // work | short_break | long_break
let timeLeft = config.work * 60;
let totalTime = config.work * 60;
let pomodoroDone = 0;
let sessionCount = 0;
let timerId = null;
let startTime = null;
let pausedElapsed = 0;

// DOM设置回显
sWork.value = config.work;
sShort.value = config.shortBreak;
sLong.value = config.longBreak;
sCount.value = config.count;

const MODE_NAMES = {
  work: { label: '🎯 专注时间', phase: '专注中', color: '#f38ba8', cls: 'mode-work' },
  short_break: { label: '☕ 短休息', phase: '休息一下', color: '#a6e3a1', cls: 'mode-short_break' },
  long_break: { label: '🌿 长休息', phase: '好好放松', color: '#89b4fa', cls: 'mode-long_break' }
};

const STATUS_TEXT = {
  idle_work: '准备开始专注',
  idle_short_break: '准备短休息',
  idle_long_break: '准备长休息',
  running_work: '专注中，保持状态！',
  running_short_break: '休息一下，放松身心',
  running_long_break: '长休息时间，好好放松',
  paused: '已暂停'
};

function getModeSeconds(m) {
  if (m === 'work') return config.work * 60;
  if (m === 'short_break') return config.shortBreak * 60;
  return config.longBreak * 60;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function setProgress(pct) {
  const offset = CIRCUMFERENCE * (1 - Math.min(pct, 1));
  progress.style.strokeDashoffset = offset;
}

function updateUI() {
  timerDisplay.textContent = formatTime(timeLeft);
  setProgress(timeLeft / totalTime);

  const mInfo = MODE_NAMES[mode];
  modeLabel.textContent = mInfo.label;
  modeLabel.className = 'mode-label ' + mInfo.cls;
  progress.style.stroke = mInfo.color;

  // 阶段文本
  if (state === 'idle') phaseText.textContent = '准备就绪';
  else if (state === 'paused') phaseText.textContent = '⏸ 已暂停';
  else phaseText.textContent = mInfo.phase;

  // 状态文本
  if (state === 'paused') {
    statusText.textContent = STATUS_TEXT.paused;
  } else if (state === 'idle') {
    statusText.textContent = STATUS_TEXT[`idle_${mode}`] || '按「开始」启动番茄钟';
  } else {
    statusText.textContent = STATUS_TEXT[`${state}_${mode}`] || '';
  }

  // 番茄计数
  pomoCount.textContent = `🍅 已完成 ${pomodoneCount()} 个番茄`;
  renderDots();

  // 按钮状态
  startBtn.disabled = state === 'running';
  pauseBtn.disabled = state !== 'running';
  skipBtn.disabled = state !== 'running';
  startBtn.textContent = state === 'paused' ? '▶ 继续' : '▶ 开始';

  // 文档标题
  document.title = state === 'running'
    ? `🍅 ${formatTime(timeLeft)} - 番茄钟`
    : '🍅 番茄钟';
}

function pomodoneCount() {
  // 如果当前在工作模式，已完成番茄数就是 pomodoroDone
  return pomodoroDone;
}

function renderDots() {
  const total = config.count;
  pomoDots.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'pomo-dot' + (i < sessionCount ? ' done' : '');
    pomoDots.appendChild(dot);
  }
}

function tick() {
  if (state !== 'running') return;
  timeLeft--;
  if (timeLeft <= 0) {
    timeLeft = 0;
    completePhase();
  }
  updateUI();
  timerId = setTimeout(tick, 1000);
}

function completePhase() {
  clearTimeout(timerId);
  timerId = null;
  state = 'idle';

  if (mode === 'work') {
    pomodoroDone++;
    sessionCount++;
    notify('🎉 番茄完成！', '干得好！休息一下吧~');

    if (sessionCount >= config.count) {
      mode = 'long_break';
      sessionCount = 0;
    } else {
      mode = 'short_break';
    }
  } else {
    notify('☕ 休息结束', mode === 'long_break' ? '准备好开始新一轮了吗？' : '继续加油！');
    mode = 'work';
  }

  totalTime = getModeSeconds(mode);
  timeLeft = totalTime;
  updateUI();
}

// ---- 通知 ----
function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍅</text></svg>' });
  } else if ('Notification' in window && Notification.permission !== 'denied') {
    Notification.requestPermission();
  }
}

// ---- 控制 ----
function startTimer() {
  if (state === 'paused') { resumeTimer(); return; }
  if (state === 'running') return;
  state = 'running';
  updateUI();
  timerId = setTimeout(tick, 1000);
}

function pauseTimer() {
  if (state !== 'running') return;
  state = 'paused';
  clearTimeout(timerId);
  timerId = null;
  updateUI();
}

function resumeTimer() {
  if (state !== 'paused') return;
  state = 'running';
  updateUI();
  timerId = setTimeout(tick, 1000);
}

function resetAll(keepMode = false) {
  clearTimeout(timerId);
  timerId = null;
  state = 'idle';
  if (!keepMode) {
    mode = 'work';
    pomodoroDone = 0;
    sessionCount = 0;
  }
  totalTime = getModeSeconds(mode);
  timeLeft = totalTime;
  updateUI();
}

function skipPhase() {
  if (state !== 'running') return;
  clearTimeout(timerId);
  timerId = null;
  timeLeft = 0;
  completePhase();
}

function saveSettings() {
  const w = parseInt(sWork.value);
  const s = parseInt(sShort.value);
  const l = parseInt(sLong.value);
  const c = parseInt(sCount.value);
  if (!w || !s || !l || !c || w < 1 || s < 1 || l < 1 || c < 1) {
    alert('请输入有效的正整数！');
    return;
  }
  config.work = w;
  config.shortBreak = s;
  config.longBreak = l;
  config.count = c;
  saveConfig(config);

  if (state === 'idle') {
    totalTime = getModeSeconds(mode);
    timeLeft = totalTime;
    updateUI();
  }
  alert('设置已保存！');
}

// ---- 键盘快捷键 ----
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggleStartPause(); }
  if (e.key === 'r' || e.key === 'R') resetAll();
});

function toggleStartPause() {
  if (state === 'idle' || state === 'paused') startTimer();
  else if (state === 'running') pauseTimer();
}

// ---- 绑定事件 ----
startBtn.addEventListener('click', toggleStartPause);
pauseBtn.addEventListener('click', pauseTimer);
resetBtn.addEventListener('click', () => resetAll(false));
skipBtn.addEventListener('click', skipPhase);
saveBtn.addEventListener('click', saveSettings);

// ---- 初始化 ----
totalTime = getModeSeconds('work');
timeLeft = totalTime;
updateUI();

// 请求通知权限
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

console.log('🍅 番茄钟已加载！快捷键: Space=开始/暂停, R=重置');
</script>
</body>
</html>

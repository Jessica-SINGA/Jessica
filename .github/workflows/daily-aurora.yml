name: Daily Aurora Update

on:
  schedule:
    # Run daily at 10:00 AM China time (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pip install googletrans==4.0.0-rc1 || pip install translate || true

      - name: Run daily aurora update script
        run: python3 .github/scripts/aurora-daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "aurora-bot"
          git config user.email "aurora-bot@users.noreply.github.com"
          git add norway-news-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily: update aurora forecast & news $(date +'%Y-%m-%d')"
            git push
          fi

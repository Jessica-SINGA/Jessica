<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>换乘恋爱 ENHYPEN Edition — Day 1</title>
<style>
  /* System fonts — no Google Fonts (blocked in China) */
  :root {
    --bg: #07070f; --surface: #0e0e1c; --card: #151528;
    --gold: #c9a96e; --gold-dim: #8a7348; --cream: #f0ebe3; --cream-dim: #9e968a;
    --muted: #55505c; --letter-bg: #18182a; --danger: #a04040;
    --winter-blue: #3a4a5c; --scar-fade: #6b4a4a;
    --font-serif: 'Noto Serif SC','SimSun','STSong','Songti SC',serif;
    --font-sans: 'Noto Sans SC','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  }
  * { margin:0;padding:0;box-sizing:border-box; }
  body {
    background:var(--bg);color:var(--cream);font-family:var(--font-sans);
    min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;
    background-image:radial-gradient(ellipse at 50% 0%,rgba(201,169,110,0.03) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(58,74,92,0.04) 0%,transparent 50%);
  }
  /* Grain texture overlay */
  body::before {
    content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
    opacity:0.6;
  }
  /* Vignette — broadcast screen feel */
  body::after {
    content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,0.45) 100%);
  }
  #app { width:100%;max-width:560px;min-height:85vh;position:relative;z-index:1; }
  #scene-container {
    background:var(--surface);border-radius:16px;padding:40px 32px 32px;min-height:500px;
    position:relative;border:1px solid rgba(201,169,110,0.1);
    box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 1px rgba(201,169,110,0.12);
    transition:opacity 0.4s ease,transform 0.4s ease;
  }
  #scene-container.fading { opacity:0;transform:translateY(12px); }
  #progress { display:flex;gap:6px;margin-bottom:24px;align-items:center; }
  #progress .dot { width:5px;height:5px;border-radius:50%;background:var(--muted);transition:all 0.4s ease; }
  #progress .dot.active { background:var(--gold);box-shadow:0 0 6px rgba(201,169,110,0.5);width:7px;height:7px; }
  #progress .dot.done { background:var(--gold-dim); }
  #day-badge { position:absolute;top:16px;right:24px;font-family:var(--font-serif);font-size:0.72rem;letter-spacing:0.18em;color:var(--gold-dim); }
  .scene-label { font-size:0.68rem;letter-spacing:0.22em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;font-weight:500; }
  .scene-text { font-size:0.93rem;line-height:1.95;color:var(--cream-dim);margin-bottom:18px;font-weight:300; }
  .scene-text em { color:var(--cream);font-style:italic; }
  .scene-text strong { color:var(--gold);font-weight:500; }
  .character-name { font-family:var(--font-serif);color:var(--gold);font-weight:600;font-size:0.95rem; }
  .narration { color:var(--cream-dim);font-style:italic;border-left:2px solid var(--gold-dim);padding-left:16px;margin:20px 0;font-size:0.87rem;line-height:1.75; }
  .choices { display:flex;flex-direction:column;gap:10px;margin-top:24px; }
  .choice-btn {
    background:transparent;border:1px solid rgba(201,169,110,0.2);color:var(--cream);
    padding:14px 20px;border-radius:10px;font-family:var(--font-sans);font-size:0.86rem;
    cursor:pointer;text-align:left;transition:all 0.25s ease;line-height:1.55;
    opacity:0;transform:translateY(8px);animation:fadeInUp 0.4s forwards;
  }
  .choice-btn:nth-child(1){animation-delay:0.05s}.choice-btn:nth-child(2){animation-delay:0.12s}
  .choice-btn:nth-child(3){animation-delay:0.19s}.choice-btn:nth-child(4){animation-delay:0.26s}
  @keyframes fadeInUp { to{opacity:1;transform:translateY(0)} }
  .choice-btn:hover { border-color:var(--gold);background:rgba(201,169,110,0.06);box-shadow:0 0 20px rgba(201,169,110,0.08);transform:translateX(3px); }
  .choice-btn:active { background:rgba(201,169,110,0.12);transform:scale(0.985); }
  .choice-btn .choice-letter { color:var(--gold);font-family:var(--font-serif);margin-right:8px;font-weight:600; }
  .choice-btn.locked { opacity:0.35;pointer-events:none;border-color:rgba(255,255,255,0.05); }
  .letter-card {
    background:var(--letter-bg);border-radius:8px;padding:28px 24px;margin:20px 0;
    font-family:var(--font-serif);font-size:0.9rem;line-height:2.1;color:var(--cream);
    border:1px solid rgba(201,169,110,0.12);position:relative;
  }
  .letter-card::before { content:'"';position:absolute;top:6px;left:14px;font-size:3rem;color:rgba(201,169,110,0.06);font-family:var(--font-serif);line-height:1; }
  .sms-notification { background:#12122a;border:1px solid rgba(201,169,110,0.18);border-radius:14px;padding:20px;margin:16px 0;text-align:center;animation:smsPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
  @keyframes smsPop { from{opacity:0;transform:scale(0.9) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .sms-notification .sms-label { font-size:0.68rem;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-bottom:8px; }
  .sms-notification .sms-body { font-family:var(--font-serif);font-size:0.88rem;color:var(--cream);line-height:1.7;margin:12px 0; }
  .sms-notification .sms-result { font-family:var(--font-serif);font-size:1.05rem;color:var(--gold);font-weight:600;margin-top:10px;padding-top:10px;border-top:1px solid rgba(201,169,110,0.1); }
  .sms-result.not-chosen { color:var(--danger); }
  .end-stats { margin:20px 0;padding:20px;background:rgba(201,169,110,0.03);border-radius:10px;border:1px solid rgba(201,169,110,0.08); }
  .end-stats .stat-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted rgba(201,169,110,0.08);font-size:0.83rem;gap:12px;flex-wrap:wrap; }
  .end-stats .stat-row:last-child { border-bottom:none; }
  .end-stats .stat-label { color:var(--cream-dim);flex-shrink:0; }
  .end-stats .stat-value { color:var(--gold);font-weight:500;text-align:right;min-width:0;flex:1; }
  #next-btn { display:block;margin:24px auto 0;background:transparent;border:1px solid rgba(201,169,110,0.25);color:var(--cream-dim);padding:10px 32px;border-radius:20px;font-family:var(--font-sans);font-size:0.78rem;cursor:pointer;transition:all 0.3s ease; }
  #next-btn:hover { border-color:var(--gold);color:var(--cream); }
  .title-screen { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:500px;text-align:center;cursor:pointer; }
  .title-screen .show-title { font-family:var(--font-serif);font-size:2.2rem;color:var(--gold);letter-spacing:0.08em;margin-bottom:6px;font-weight:700; }
  .title-screen .show-subtitle { font-size:0.82rem;color:var(--cream-dim);letter-spacing:0.28em;margin-bottom:40px; }
  .title-screen .start-hint { font-size:0.72rem;color:var(--muted);animation:pulse 2.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }
  .scene-divider { text-align:center;margin:16px 0;color:var(--gold-dim);font-size:0.68rem;letter-spacing:0.3em; }
  .pheromone-hint { display:inline-block;color:var(--gold-dim);font-style:italic;font-size:0.8rem;background:rgba(201,169,110,0.05);padding:2px 10px;border-radius:4px; }
  .pheromone-cold { color:var(--winter-blue);font-style:italic;font-size:0.8rem; }
  .pheromone-hot { color:var(--gold);font-style:italic;font-size:0.8rem; }
  .pill-bottle { display:inline-block;color:var(--scar-fade);font-size:0.8rem;background:rgba(160,64,64,0.08);padding:2px 8px;border-radius:4px;letter-spacing:0.05em; }
  .sunoo-thought { color:var(--gold);font-style:italic;font-size:0.82rem;border-left:1px solid rgba(201,169,110,0.3);padding-left:12px;margin:12px 0; }
  .save-banner { margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap; }
  .save-btn { background:rgba(201,169,110,0.08);border:1px solid var(--gold);color:var(--gold);padding:10px 36px;border-radius:20px;font-family:var(--font-sans);font-size:0.83rem;cursor:pointer; }
  .save-btn-ghost { background:transparent;border:1px solid var(--muted);color:var(--cream-dim);padding:10px 24px;border-radius:20px;font-family:var(--font-sans);font-size:0.8rem;cursor:pointer; }
</style>
</head>
<body>
<div id="app"><div id="scene-container"></div></div>

<script>
const game={
  sunooTension:0, sunghoonWarmth:0, armorCracked:false, smsTarget:null, sceneIndex:0,
  pillExposed:false, scarSeen:false, sunooGuilt:0, pickedHardC:false
};
const totalScenes=10;
const SAVE_KEY='transit-love-d1-v3';
function saveGame(){const d={sunooTension:game.sunooTension,sunghoonWarmth:game.sunghoonWarmth,armorCracked:game.armorCracked,smsTarget:game.smsTarget,sceneIndex:game.sceneIndex,pillExposed:game.pillExposed,scarSeen:game.scarSeen,sunooGuilt:game.sunooGuilt,pickedHardC:game.pickedHardC};localStorage.setItem(SAVE_KEY,JSON.stringify(d));}
function loadGame(){const r=localStorage.getItem(SAVE_KEY);if(!r)return false;const d=JSON.parse(r);Object.assign(game,d);return true;}
function hasSave(){return localStorage.getItem(SAVE_KEY)!==null;}
function clearSave(){localStorage.removeItem(SAVE_KEY);}

const scenes=[

// 0: TITLE
{render(){
  const saveHTML=hasSave()?'<div class="save-banner"><button class="save-btn" onclick="event.stopPropagation();loadGame();renderScene();">继续上次进度</button><button class="save-btn-ghost" onclick="event.stopPropagation();clearSave();renderScene();">重新开始</button></div>':'';
  return '<div class="title-screen" onclick="advanceScene()"><div class="show-subtitle">ENHYPEN EDITION</div><div class="show-title">换乘恋爱</div><div class="show-subtitle" style="margin-top:2px">DAY 1 · 入住日</div><div class="start-hint" style="margin-top:48px">轻触屏幕开始</div>'+saveHTML+'</div>';
}},

// 1: INTRO — winter atmosphere (~1100 chars)
{render(){return '<div class="scene-label">入住 · 十二月</div>'
+'<div class="scene-text">十二月的首尔。汉江在远处安静地反着灰白色的光。共享屋是一栋浅奶油色的两层别墅，隐匿在城北洞一条安静的坡道上。院子里有棵柿子树——光秃秃的，枝丫像是谁用铅笔随意画上去的线条，指着灰白的、正在变暗的天空。远处有山的轮廓，被淡淡的雾霭模糊了边缘。</div>'
+'<div class="scene-text">推开院门的时候，冷风灌进衣领。石子路两边是修剪过的冬青，叶片上还挂着下午的霜。玄关的风铃轻轻响了一声——然后静下来，等着下一个推门的人。</div>'
+'<div class="scene-text">厨房的中岛台上整整齐齐摆着<span style="color:var(--gold)">八只马克杯</span>——墨绿色、雾蓝色、米白色、炭灰色、浅粉色、深棕色、奶黄色、陶红色。每只颜色都不一样，像是各自在等一个特定的主人。暖气片在墙角发出轻微的咔咔声。客厅的唱片机旁边放着一张黑胶——还没翻开。整个房子安安静静的，像一个深吸了一口气还没有吐出来的人。</div>'
+'<div class="narration">小茶把行李箱拖进玄关的时候，左手下意识拢了拢右手腕的袖口。一个习惯。六个月的习惯。黑色高领毛衣遮住了她需要遮住的一切——除了眼睛。眼睛遮不住。</div>'
+'<div class="scene-text"><span class="character-name">韩智恩</span>第一个到。二十九岁，济州岛来的咖啡店老板。她推开门的瞬间，风铃响了——一串清脆的、像海浪拍打礁石又碎掉的声音。她穿着燕麦色的毛衣，袖子挽到小臂，露出被济州岛太阳晒过的健康肤色。两个酒窝很深——笑的时候像在咖啡里多加了一勺糖。她说自己带了济州岛的柑橘，放在厨房了，"大家到了之后可以尝尝。"没有人知道她也是来见前任的。</div>'
+'<div class="scene-text">然后是<span class="character-name">沈载伦</span>。ENHYPEN成员，二十四岁，Beta。推门的声音很轻——但他进来的瞬间，客厅里的空气像被充了氧。他笑起来总有后半句，韩英双语切换得比眨眼还快。"哇，这房子比我想象的大——"他用韩语说了前半句，后半句切换成英语，然后自己笑了。他认出了智恩——不是认出人，是认出了她从济州岛带来的柑橘。他拿起一颗，在掌心里转了转。没有人注意到他的笑容在那个瞬间收了半秒——半秒之后又亮起来，比之前更亮。</div>'
+'<div class="scene-text">再然后是<span class="character-name">崔秀雅</span>和<span class="character-name">梁祯元</span>。秀雅走在前面——身高让她的入场像一栋建筑在移动。三十岁，Alpha，建筑设计师，黑色长大衣，灰色高领，白色衬衫领口翻出来。她的气场黑白灰三色，没有多余的东西。祯元跟在后面——ENHYPEN的队长，二十三岁，Omega。他的存在感像一杯温的竹茶——不烫，但你不会忽略。他进门的时候环顾了一圈，目光在每个人的脸上停了刚好一秒。不多，不少。像是他已经算好了这个空间里的所有变量。秀雅从他旁边走过去的时候，没有打招呼。祯元也没有看她。他们的距离——两米——像量过的。</div>'
+'<div class="scene-text"><span class="character-name">姜艺琳</span>和<span class="character-name">朴成训</span>先后到达，中间隔了大约十五分钟。艺琳是《W Korea》的主编，三十一岁，Omega。她推开门的时候带进来一阵冷风和一股极淡的白芍药——干净、克制、像杂志上印着的香水广告，好闻但不太靠近。高跟鞋在玄关的石板上敲了两声，然后换成室内拖鞋。每一个动作都精准——拆围巾、挂大衣、环顾四周。但挂大衣的时候，她的手在衣架上停了一秒——没有人知道为什么。</div>'
+'<div class="scene-text">成训进来的时候，冬天换了另一种方式变安静。ENHYPEN成员，二十四岁，Alpha——他走进客厅像一棵移动的冷杉。不是冷的冷。是干净的、像雪后的树林那种清冽，属于冬天但不攻击人的凉。他的视线扫过客厅——在暖气片旁边的位置停了一下。那里站着艺琳。只有一秒。然后移开，像什么都没发生。艺琳的手在她面前的咖啡杯旁边放着一动不动。没有人注意到。没有人应该注意到。客厅里六个人了，气氛客气而安静——安静得像一杯放凉了的水。</div>'
+'<div style="text-align:center;margin-top:24px"><button id="next-btn" onclick="advanceScene()">继续</button></div>';}},

// 2: SUNOO ARRIVES (~950 chars)
{render(){return '<div class="scene-label">入住 · 第七位</div>'
+'<div class="scene-text">风铃又响了。</div>'
+'<div class="scene-text">但这一次——不一样。不是风铃先响，是他的手在推门之前就已经放上去了。然后才响。</div>'
+'<div class="scene-text"><span class="character-name">金善禹</span>推门进来——然后冬天往后退了一步。</div>'
+'<div class="scene-text">米白色高领毛衣。深蓝色大衣搭在手臂上——不是穿着，是搭着，像是他来不及穿好。刘海比六个月前长了一点，柔软地扫过眉尾。他站在玄关，十二月在他身后缩成了一个灰白色的点。然后他笑了——眼睛弯成月牙，然后习惯性地用手背捂住嘴。那个动作她见过一万次。现在看到，像是有人用指甲在她胸口划了一下——很轻。很轻。但划到了旧伤上面。</div>'
+'<div class="scene-text">他笑着和每个人打招呼——祯元叫他"哥"，声音里有一点很淡的、只有队友之间才有的温度。载伦用手肘碰了他一下，"你怎么又穿高领——"善禹笑着躲开。他在笑——和每个人都在笑。但她看到了。他<span style="color:var(--gold)">瘦了</span>。颧骨的轮廓比以前更分明，下颌的线条比六月时更利。米白色毛衣在他身上多出了一层空隙——一个瘦了的人裹在旧衣服里的那种空隙。他的眼神在笑，但笑到眼睛底之前停住了。像有人在那里画了一条线——线以上的笑容是可以给任何人的。线以下是——什么也没有。至少看起来是什么也没有。</div>'
+'<div class="scene-text">他环顾客厅的时候，目光扫过她的方向——</div>'
+'<div class="narration">停了四分之一秒。不到一次眨眼的长度。然后移开——像她的位置只是一个普通的坐标，和其他七个陌生人没有区别。像是她坐在那里不重要。像是六个月没有发生过。像是四月和五月从来没有来过。</div>'
+'<div class="scene-text">但他的<span class="pheromone-hint">雪松威士忌</span>出卖了他。那股本来应该暖而烈的木质调信息素——<strong>比以前淡了</strong>。不是淡到闻不到。是淡到像是被什么东西稀释过——像是他把自己的信息素拧到了最低档，只留下最表面的一层。但那层还在。他的信息素还在。她的信息素认得他的。六个月了，还是认得。她的指尖在膝盖上轻轻收紧了——一种只有她自己知道的反应。一种她的身体在她意识到之前就做出来的反应。</div>'
+'<div class="narration">他没有找到他要找的人。第七只杯子——墨绿色的——还在厨房台面上。第八只杯子也在等。第八个人还没到。善禹在自己的杯子旁边站了一秒。然后他拿起它——没有倒水，只是拿起来，看了一下杯底，又放回去。没有人看到这个动作。除了一个人。</div>'
+'<div style="text-align:center;margin-top:24px"><button id="next-btn" onclick="advanceScene()">继续</button></div>';}},

// 3: XIAOCHA'S ENTRANCE — Choice 1 (~900 chars narrative)
{isChoice:true,choiceId:1,
render(){return '<div class="scene-label">入住 · 第八位</div>'
+'<div class="scene-text">门开了。</div>'
+'<div class="scene-text">不是推开的。是风自己灌进来的。然后客厅里七个人同时转头——七张脸，七个方向，七种不同程度的注视。</div>'
+'<div class="scene-text">门口站着一个棕色齐肩短发的女生。黑色高领毛衣——领口严严实实地裹到下颌。左手腕上叠着两条细细的银手链——其实是一条，在腕骨上绕了两圈，刚好遮住了需要遮住的东西。围巾绕了两圈，遮住半张脸。她身后是十二月的冷风和已经黑透了的天。街灯把她的轮廓勾了一圈冷白色的边——她站在那道边的里面，像一个从冬天的照片里走出来的人。</div>'
+'<div class="scene-text"><span class="character-name">小茶</span>——最后一个入住者。AURA化妆品公司品牌总监，二十八岁，Omega。她的信息素是植物系的清冷调——不是花香，不是果香，是更安静的、像初冬清晨植物叶面上那层薄薄水汽的味道。</div>'
+'<div class="scene-text">她的视线扫过所有人——每个人脸上一秒。韩智恩的酒窝、沈载伦被济州岛太阳晒过的笑容、崔秀雅精确到毫米的站姿、梁祯元正在评估她的目光、姜艺琳停在咖啡杯上的手指、朴成训安静站在暖气片旁边的轮廓——每个人一秒。然后停在了<span style="color:var(--gold)">那个人</span>身上。一秒。只有一秒。然后移开——不是移开，是收回来。像被烫到。</div>'
+'<div class="scene-text">金善禹站在沙发旁边。他看到她的一瞬间，身体微微往后退了——不是退后，是<strong>晃了一下</strong>。幅度小到除了她之外大概没有人注意到——但她的眼睛从头到尾都没有离开过他的方向，尽管她的脸朝向是大家。他晃了一下，像是有人在他胸口轻轻推了一把。然后他把右手插进口袋——她认得这个动作。他在藏什么。他以前紧张的时候就会把手插进口袋。他在藏他指尖的颤抖。六个月前她见过他这样——在他说不出话的时候，在他不知道该怎么开口的时候。现在他又这样了。但她已经不是那个会走过去轻轻把他手从口袋里拉出来的人了。</div>'
+'<div class="narration">六个月前。他消失的那个晚上，她给他打了很多电话——每一个都响到自动挂断。那之后的一个月，她学会了不打电话。那之后的三个月，她学会了不对着空气说话。那之后的六个月——她站在这里，和他共享着同一间客厅的空气。共享着同一声暖气片的咔咔响。共享着从壁炉里跳出来的同一束仿焰火。她的胸口在收紧。但她的脸——她的脸什么都没有表现出来。这是她花了六个月学会的。这是她所有的盔甲。</div>'
+'<div class="scene-text" style="color:var(--gold);font-weight:500;text-align:center;margin-top:20px">你走进客厅。所有人都在等你开口。外面的风在玄关被关上了——风铃最后一个音符落在地上。客厅很安静。</div>';},

  {letter:'A',text:'职业微笑。对每个人平等地问候——"你好，我是小茶。"到善禹的时候，你的声音和问候智恩时一模一样，礼貌，完整，不多不少。他只是一个恰好也在房间里的陌生人。一个和你共享过六十一天、然后在某个六月的晚上像水汽一样蒸发掉的陌生人。',hint:'善禹的表情没有变化。但他的喉结动了——第二次了。她看到了。她没有给任何反应。她的微笑贴得很好——完美到像一张照片。',tension:0,warmth:0},

if(t>=3) extra='<div class="narration">小茶进门之后，善禹一直没怎么说话。他手里的墨绿色马克杯——水面从刚才到现在没有下降过一毫米。他在客厅沙发上坐了一会儿，然后站起来，走到厨房门口，又折回来，重新坐下，手里折着一张不知道从哪里来的纸巾——对折、再对折、展开、重新折。反反复复。他的雪松威士忌时浓时淡——不是自然的波动，是刻意的。像是他在反复练习怎么呼吸。或者他忘了怎么呼吸。他的信息素从刚才开始就没有稳定过——在她对成训笑的那一秒变冷，在她走过他旁边的时候又没有任何预兆地回暖。他不是在控制。他是在失控和控制之间反复摔跤。</div>';

  {letter:'C',text:'站到成训旁边——肩膀差五厘米就碰到了。这个距离不是暧昧的。这个距离是危险的——近到一个人的信息素可以和另一个人的在空气里轻轻碰一下，而不需要任何人许可。"上次演唱会……内场第三排。你还记得吗？"你抬头看他。他低头看你。冷杉和你的植物系信息素在五厘米之间安静地发生了一次接触——一种不属于善禹的气味，一种清冷的、初冬晨露般的交融。成训看了你一秒。他的眼神不是在回答。是在记住。门外走廊上，雪松威士忌的味道在同一个位置停留了整整三秒——然后才继续移动。没有脚步声，没有敲门声，没有任何声音。只有信息素。在门口。多留了三秒。',hint:'善禹没有推门。没有走进来。没有发出任何声音。但他停了三秒——在三秒里，他的雪松威士忌是今晚最浓烈的。那是他今天最诚实的片刻。然后他走了。信息素在他身后收回去——像退潮。但三秒已经够了。你知道。他知道。成训大概也知道。',tension:2,warmth:3}

render(){return '<div class="scene-label">夜晚 · X信件</div>'
+'<div class="scene-text">客厅灯光调暗了。壁炉的仿焰火在每个人脸上跳动——橙色的、柔软的、说谎的光。它把每个人的影子拉长、变形、重叠在一起——然后分开，又重叠。大家围坐在沙发和地毯上，每人手里一个白色信封。没有署名。没有收件人。只有一张纸的重量——但这张纸上的每一个字，都是写给一个曾经在任何地方都认得你笔迹的人。</div>'
+'<div class="scene-text">主持人说明规则：<em>"以\'致我的前任\'开头。不署名。不暴露身份信息。你写的情书，或者你写的遗书——由你决定。但记住，在这个屋子里，你的前任正在听。"</em></div>'
+'<div class="scene-divider">✦</div>'
+'<div class="scene-text">艺琳先读了。她的声线依然精准——像杂志上排版好的铅字，每一个字都在它该在的位置。但信纸边缘被捏出了细小的皱痕——那种只有真正用力捏过才会留下的、像指纹一样的皱痕。她读完之后没有看任何人。成训的冷杉信息素在那个角落里——淡了一点。只有一点。智恩的声音是暖的，念了关于济州岛的海风、清晨五点的咖啡馆、和"某个总是笑着的人笑起来比咖啡更暖"。然后她笑了——两个酒窝很深。但载伦看着壁炉，第一次没有笑着接她的话。他的眼睛里有壁炉的反光——也许是反光，也许不是。秀雅念得平稳克制——每一个句号都画得干净利落，像签完一份工程文件。但祯元在她坐下之后，竹茶信息素软了一瞬。只是一瞬。但整个客厅都感觉到了——那种属于队长的、一直稳稳撑着的什么东西，软了一下。</div>'
+'<div class="scene-divider">✦</div>'
+'<div class="scene-text">主持人看向善禹。<em>"下一位。"</em></div>'
+'<div class="scene-text"><span class="character-name">金善禹</span>站起来的时候，动作慢了半拍——不是身体的慢，是某种更深的犹豫。他的手伸进信封——那个白色信封上有你的笔迹。你写的每一个字他马上要读出来。他要用他自己的声音，念出你花了六个月才写下的话。你不知道他会怎么样。你也不知道自己会怎么样——在你听到自己的句子被他念出来的时候。</div>'
+'<div class="narration">他打开了那封信。你的信。他低头看了很久——久到主持人准备开口提醒他——然后他开始了。他的第一句话出口的时候，声音是平稳的。然后到第三行——他开始控制不住。他的声音在某些词上轻轻抖了一下，像冰面裂了一道细纹。他试图补——加速读过去，但越加速越抖。他念到中间的某一段时停了一次。很短。然后继续。他的手指在信纸边缘收紧了——那道折痕后来一直没有消掉。</div>'
+'<div class="letter-card">致我的前任：<br><br>我写这封信的时候是十二月初。首尔开始下雪。我站在窗前看雪落在柿子树上——你现在能看到同一棵树。不知道你看到它的时候，会不会想起我。<br><br>我们在一起的时间不长——很短。但很奇怪——有些人在你生命里只待了很短的一段日子，离开的时候却把一整个季节都带走了。我的四月和五月是你。六月是你离开的背影。七月、八月、九月、十月、十一月——是你不在的时候我学会的所有事情。<br><br>我学会了不再给你发消息。我习惯了删掉对话框而不是等回复。我习惯了在咖啡店点单人的量。我习惯了你喜欢的那首歌不再是我的闹钟铃声。我习惯了很多——闭上眼睛不再看到你的脸、路过那家店不再转头看窗边的位置、手伸向手机的时候在半空中停住因为我想起来我答应过自己不会再主动了。我习惯不了的是——为什么。<br><br>你走的那天晚上我给你打了很多电话。不是要你回来——我知道你不会回来了。只是想知道为什么。你的行李还在我家。你的杯子还在厨房台面上——那只是一只杯子。一只普通的杯子。我用了很久才把它收进柜子最里面——不是扔掉。是收起来。因为扔掉需要一种我那时候还没有的决绝。<br><br>留下的人需要的勇气不比离开的人少。每天早上醒过来，知道不会再有你的消息——然后还愿意起床，需要勇气。把你的东西收起来——需要勇气。写这封信——对着白纸一个字一个字地写，像是把好不容易结了痂的地方重新撕开——需要勇气。我用了六个月才攒够写这封信的勇气。六个月，一百八十多天。每一天都从睁开眼睛开始，到闭上眼睛结束。中间的那十几个小时——就是用各种任务填满自己，让自己没有空隙想到你。但空隙总是在的。在开会和开会之间的那五分钟、在电梯门关上之后独自站着的那二十秒、在关灯之后天花板上那道从窗帘缝里漏进来的光。空隙无处不在。你在每一个空隙里面。<br><br>但我想让你知道一件事：我不恨你。我以为我会——在我坐在浴室地板上不知道过了多久的那些时刻、在我发现自己身上多了很多连我自己都不知道是什么的痕迹的那些日子、在我思考人生还有什么值得继续的时候——我以为恨是唯一能让我撑下去的东西。但后来我发现不是。恨一个人需要把所有的回忆都烧掉。而我做不到。我舍不得。<br><br>那些回忆是真的。它们是我弄不坏的东西。是我们短暂的相遇里——你给过我的全部。<br><br>如果有一天你准备好告诉我答案了——我在。我不保证我会原谅你。但我在。你欠我一个为什么。我没有在等——不是等。但如果你来，我会听。<br><br>如果那一天永远不会来——那我希望你是幸福的。不是"因为离开了我"才幸福。只要幸福就够了。不要是因为愧疚。不要是因为弥补。只是幸福。单纯地、好好地。<br><br><em>祝你一切都好。</em></div>'
+'<div class="scene-text">善禹读完了。他的声音在最后一行几乎消失了——不是音量，是某种支撑声音的力量在最后一行被抽走了。他在念到"不要是因为愧疚"的时候，声带像被什么东西掐了一下。念到"我不恨你"的时候——他的声音碎了。只是一瞬。但他碎了。现在他坐在沙发上，信纸放在膝盖上，没有折起来。他的眼睛很亮——不是哭了，是差一点。眼泪已经到眼眶边缘了，但他没有让它掉下来。他是个Alpha——从小被教不会在人前掉眼泪的人。但他的雪松威士忌不会骗人。那股本来一直被他压得很低的信息素——现在<strong>全涌出来了</strong>。不是淡的，不是收敛的，是烫的。滚烫的。像是有人打翻了一杯威士忌，酒精泼在壁炉边上，烧起来了。整个客厅被雪松威士忌填满了——暖的、烈的、乱的。</div>'
+'<div class="narration">他在看她。第一次——今天第一次，他直视了她。没有移开。没有用余光。没有假装在看别的地方。他的眼睛在问一个问题。不是"你还好吗"。不是"对不起"。是更简单的——<strong>"你写的这些——是真的吗。你是真的不恨我吗。还是你只是写了你最想成为的那个人。浴室地板——是什么。你身上多出来的那些痕迹——是什么。你为什么不告诉我。"</strong>他没有问出口。但整个客厅都听到了。</div>'
+'<div class="scene-divider">✦</div>'
+'<div class="scene-text">现在轮到你了。</div>'
+'<div class="scene-text">你打开信封。纸上是善禹的笔迹。他的字从来不好看——每一笔都像小学生写的，横不平竖不直。但你认得每一个弯钩，每一笔收尾。他写"爱"字的时候，最后一点总是特别轻，像是怕弄疼了纸。六个月了——你认得。比你自己写的字更认得。</div>'
+'<div class="narration">她的手有一点抖。不是因为紧张——是因为她已经六个月没有在这么近的距离看到他的笔迹了。也是因为她刚刚听到了他用他的声音念她写的话——那比任何事都更需要承受。现在轮到她。轮到她对着所有人——对着他——念出他写了什么。左手下意识握住了右手腕。银手链下面——是淡去的、白色的线。那个让她从六月活到了十二月的药瓶在行李箱夹层里。她没有去拿。她只是握住了自己。</div>'
+'<div class="letter-card">致我的前任：<br><br>写这封信的时候是凌晨。我写了很多遍。每一遍都不对。不是字不好看——我的字从来就不好看。不对的是我不知道从哪里开始。<br><br>从哪里开始呢。从第一次见到你那天——你坐在窗边，低着头在看什么东西，眉头微微皱着。你抬头的那一眼不是看我。是看门口的方向。只是我刚好站在那里。但你的眼睛在那个瞬间被夕阳照得很亮。后来我知道那只是角度——夕阳从那个角度穿过窗玻璃，谁的眼睛都会亮。但我每次想起那天，都还是觉得你的眼睛里有一种只属于你的光。一种后来我再也没有在别人眼睛里找到过的光。<br><br>和你在一起的每一天我都记得。记得你早上起床第一件事是确认时间——不是看消息，不是刷手机，是看时间。你总是很准时。除了要见我的日子。见我的日子你总会晚一点点——不是因为忘了。是因为站在衣柜前面选了很久。你最后穿的那件——不是最贵的，不是最新的。是穿着最舒服的。你总是在"好看"和"舒服"之间选舒服。你以为我不知道。我知道。我知道你很多事情。<br><br>我知道你忙起来会忘记吃饭——不是真的忘记，是懒得去热。所以我才一直给你发消息提醒。那不是唠叨。那是我隔着距离唯一能给的东西。我知道你生气的时候会说很重的话——但你的手在抖。你以为你在推开我。但你的手每次都在说和嘴巴相反的话。你的手从来没有推开过我。一次都没有。<br><br>我知道你在外面总是冷着一张脸——但回到家对着镜子的时候，你会对自己笑一下。不是开心的那种笑——是"今天也活下来了"那种笑。我没告诉过你我知道这个。但我一直知道。<br><br>对不起。这三个字我写得很慢。不是因为羞耻——是太重了。对不起那天晚上没有接你的电话。你打了很多次。我都看到了。每一次屏幕亮起来——你的名字，然后暗下去。亮起来，又暗下去。我的手指在接听键上面悬了很久很久。但我没有按下去。不是不想。是太想了——想到我不敢。我怕我一听到你的声音就会动摇。我怕我下一秒就会跑回去。那时候的我觉得自己不能回头。我觉得我不够好。我怕我伤害你——结果可能我用了一种最笨的方式，伤你最深。<br><br>我那天晚上没有睡。第二天也没有。之后的很多很多天都没有。躺在黑暗里，想你说过的每一句话。想我有没有好好回答过你——大部分时候没有。想我有没有让你知道你对我多重要——我从来没有。我后悔了。不是后悔离开——离开是因为那时候的我觉得这是唯一的路。我后悔的是离开之前什么都没有说。后悔让你在我走后一个人。后悔你打来的那些电话——每一个都响到断掉，而我只是看着。<br><br>你教会我被一个人真心喜欢是什么感觉。不是任何外在的原因。只是因为你愿意。你愿意在很累的时候还听我讲练习室发生的无聊的事——那件事和你没有关系。但你都听了。不是假装在听。是真的在听。你的眼睛在我说到好笑的地方会弯一下——不是笑出来，是弯一下。我后来在很多人脸上找过那个弯——没有找到。<br><br>你教会我，我不是因为是个Alpha才值得被爱。不是因为信息素——你从来不是因为我的信息素才喜欢我的。有一次我易感期信息素暴走——你没有推开。你坐在那里，靠得很近，但不是因为信息素。是因为你愿意。你让一个总是在"应该"和"不应该"之间挣扎的我——在你面前不用想那么多。只需要存在。<br><br>如果这封信被你读到——如果此刻我还能看到你，哪怕只是侧脸、背影、或者桌子的对面——我会告诉自己：这一次，不要逃。这一次，哪怕怕，也要等。<br><br>谢谢你曾经爱过我。很普通的那种爱、在清晨发来的"记得吃饭"的那种爱、在深夜还愿意回我一句的那种爱。那种爱。那种我在别人那里再也没有找到过的爱。<br><br><em>谢谢你让我写这封信。</em></div>'
+'<div class="scene-text">客厅里安静到了极致。连壁炉的仿焰火都停了一帧。没有人动。没有人说话。七双眼睛看着你。但斜对角有一双眼睛——热得像要把信纸烧出一个洞。你没有抬头。但你知道是谁。你从头到尾都知道。你刚才听他念你写的每一个字——每一个字都经过了他的喉咙。你也听到了他声音碎掉的那个瞬间。现在轮到你。念他写给你的。只是念。只是把每一个字从他写给你的纸上念出来。</div>';},
choices:[
  {letter:'A',text:'平静地读完。每个字清晰。每个音节都在它该在的位置——像在读一份公函。"谢谢你让我写这封信。"你把信纸整整齐齐折好，放回信封。放下的信纸像一张收据——公正，冰冷，付讫。没有人看到你的手指在信纸下面轻轻握住了——握得很紧。',hint:'善禹低下头。他的喉结动了第三次。他的手指在膝盖上摊开——然后慢慢握成了拳头。不是愤怒。是某种更安静的东西。一种"我果然猜对了——她已经把我归位了"的安静。那种安静比愤怒更痛。',cracked:false,tension:1},
  {letter:'B',text:'一路平稳地读下去。每个字都稳——直到最后一句。"谢谢你让我写这封信。"你停了。停了不到一秒。在那不到一秒里你听到斜对面一个人屏住了呼吸——他憋气的声音比呼吸声更响。你把信折好。继续呼吸。像什么都没发生。但你的手在信纸上多停了一拍——那一拍，他看到你了。',hint:'盔甲裂了一道缝。很小——只有一毫米。但斜对面的那个人透过那一毫米看到了你不准备让任何人看到的东西。他的眼眶红了四分之一秒。然后他眨了眨眼。再然后他飞快地看向窗外——窗外什么都没有，只有山脊线和一棵秃了的柿子树。他看得很用力。用力到忘记呼吸。',cracked:true,tension:0},
  {letter:'C',text:'微笑着读完。语气轻松得像在读一封很久以前收到的、已经不再重要的信。每一个"对不起"都念得像一个过期的天气预报。"写得挺好的。"你把它整整齐齐折好——像处理一封不再需要回复的公函。然后你的左手握住了右手腕。收紧。一个收紧了什么东西的姿势。你没有笑到眼睛里。但你笑了。全程。',hint:'表演满分。但生气比冷淡更暴露——因为生气需要在乎。善禹见过你每一种生气。他知道你在乎是什么样子。他不敢看你了——不是不想。是不敢。他的信息素在角落里缩成了一团。',cracked:false,tension:2},
{letter:'D',text:'拆开信，看了一眼。折好。放回信封。"我读不了。"声音很平——不是愤怒，不是悲伤，只是很平。像水面。像什么也没有的水面。然后起身——没有看任何人——走向洗手间。门关上了。咔嗒。水龙头打开了。水流了很久很久。没有人去敲门。没有人敢。',hint:'善禹的信息素几乎消失了——不是淡，是消失，像是被人从房间里抽走了所有的雪松威士忌。他盯着你留在沙发上的空信封，眼睛里有一种他从来没有过的东西——恐惧。他第一次真正意识到：他可能已经弄坏了一些修不好的东西。洗手间里水还在流。你没有在哭——你没有在镜子前面。你站在水龙头前面。左手握着右手腕。水很冷。药在行李箱里。你还没有去拿。',cracked:false,tension:4,hiddenD:true,needHardC:true}
]},

// 6: DINNER — Choice 4 (~750 chars narrative)
{isChoice:true,choiceId:4,
render(){const cracked=game.armorCracked;let note='';
if(cracked) note='<div class="narration">你读信时停的那一下——不到一秒——斜对面的那个人精准地捕捉到了。他没有错过。他没有错过任何关于你的事。他没再看你——但他也没再看其他任何人。他的注意力有了一个圆心。圆心在你身上。他的雪松威士忌<strong>回暖了</strong>——不再是刻意压低的冷调，而是像有人在壁炉边倒了一杯，放在那里，让它慢慢回温。他没有走过来。但他也没有走远。他在等——等你需要他。或者等你不需要。他会一直等。这是他六个月前就该做的事。</div>';
else if(game.sunooTension>=4) note='<div class="narration">善禹没有看任何人。他的信息素几乎闻不到了——不是收敛，是像被迫关上了一扇门。他把自己在房间里的存在感调到了最低——但他的手放在膝盖上，指尖微微泛白。他在用力。他在用力让自己保持在这个椅子上。他在用力不要站起来走到你面前。他在用力不要去想你刚才在水龙头前面站了多久。他的手在用力。他的全部都在用力。</div>';
else note='<div class="narration">善禹在看窗外。窗外什么都没有——只有暗下来的山脊线和一棵光秃秃的柿子树。他看得很认真，认真到不自然。他的侧脸在蜡烛光里有一道安静的轮廓——颧骨比以前高了，下颌比以前利了。你知道他在用余光看你。你也是。你们隔着一张长餐桌，中间是所有人——而你们在用余光分享一个没人知道的秘密。你们还在乎。</div>';
return '<div class="scene-label">晚餐 · 长餐桌</div>'
+'<div class="scene-text">长餐桌上点着蜡烛——四根白色的长蜡烛，火焰在每个人脸上投下暖色的、微微晃动的光斑。大酱汤冒着热气，一小片海带在汤面上轻轻旋转。烤牛肉码得整齐——深褐色的表面泛着油光，芝麻粒嵌在肉片的纹理里面。几碟小菜各占一角：辣白菜切得均匀，黄瓜泡菜的水分还在反光，一碟凉拌豆芽在蜡烛旁边显得格外白。智恩和载伦搭伙做的值日生料理——简单，但每一筷子都带着济州岛海风的咸味和首尔冬夜的甜味。</div>'
+'<div class="scene-text">大家陆续走进餐厅。椅子被拉开的声音、筷子碰到碗边的声音、有人在低声说"这个好好吃"——餐桌上的声音织成了一张细密的网。但你听的不是这些声音。你听的是对面、斜对过、桌子另一端——某个人的筷子有没有碰到碗。</div>'+note;},
choices:[
  {letter:'A',text:'走到成训旁边。"这里有人吗？"你已经知道答案了。他也是。你用筷子轻轻调整面前的小菜碟——而他安静地给你腾出更多空间，把自己的碗往左边推了五厘米。不多不少。成训的冷杉信息素近在咫尺——干净的、不逼人的、像雪后树林里最安静的那一棵树。你用余光看到他在看你。不是审视——是观察。友善的、不急着有结论的观察。',hint:'善禹在餐桌另一端。他的筷子在手里转了一下——一个下意识的动作，像他的身体在替他紧张。然后他开始和智恩说话——笑得太快了，笑到智恩还没说完他就笑了。他和智恩说话的时候，脸始终朝着智恩的方向。没有转头。一次也没有。但他的雪松威士忌——他的信息素永远学不会说谎——比刚才浓了一点。浓在你坐下的那个方向。',tension:1,warmth:2},
  {letter:'B',text:'不挑位置。随便坐。结果祯元在你左边——他递了酱油过来，"这个要蘸着吃"——声音平稳，表情不大，但温度刚好。成训在你斜对面，夹了一块牛肉之后安静地咀嚼，存在感轻而稳。你和祯元聊了聊设计、团队管理、一场演唱会需要协调的无数细节——你们的声音织进了餐桌整体嘈杂的一部分。善禹在你这一排的尽头——不在你的视线范围内。',hint:'但你闻得到雪松威士忌。很淡——但很持续。他没有收敛——是自然的淡。像是在走神。像是在想事情。他的信息素今晚一直不太对——不是淡和浓的问题，是调子不稳。像是有人在反复调收音机的频道，但每一次都差一点点就到清晰的频率。每一次差的那一点点——都指向你的方向。',tension:0,warmth:0}
]},

return '<div class="scene-label">深夜 · 房间</div>'

+'<div class="scene-text">你走到行李箱前面——蹲下，拉开夹层的拉链。一个<span class="pill-bottle">橙色药瓶</span>。标签上的字在暗光里看不清。不需要看清。你已经读了太多次了。倒出一粒——白色的，小小的，放在掌心里，和每一天一样小。你拧开水瓶。药片在舌根上化开半秒——苦的——然后吞下去。苦味留在喉咙里。一种你已经习惯了的不舒服。一种让你可以在今晚闭上眼睛的东西。</div>'

  setTimeout(()=>{
    let h=renderProgress()+'<div id="day-badge">DAY 1</div>';
    h+=s.render();
    if(s.isChoice){
      h+='<div class="choices">';
      const filteredChoices=s.choices.filter(ch=>!ch.needHardC||game.pickedHardC);
      filteredChoices.forEach((ch,i)=>{
        h+='<button class="choice-btn" onclick="makeChoice('+i+')"><span class="choice-letter">'+ch.letter+'</span>'+ch.text+'<br><small style="color:var(--cream-dim);font-size:0.75rem">'+ch.hint+'</small></button>';
      });
      s._filteredChoices=filteredChoices;
      h+='</div>';
    }
    c.innerHTML=h;c.classList.remove('fading');
  },300);
}

function advanceScene(){
  if(game.sceneIndex<totalScenes){game.sceneIndex++;saveGame();renderScene();}
}

function makeChoice(idx){
  const s=scenes[game.sceneIndex]; if(!s||!s.choices)return;
  const ch=(s._filteredChoices||s.choices)[idx];
  if(!ch)return;
  if(s.choiceId===1){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;
    if(ch.hardC)game.pickedHardC=true;
  } else if(s.choiceId===2){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;
  } else if(s.choiceId===3){
    game.armorCracked=ch.cracked;game.sunooTension+=ch.tension;
    if(ch.hiddenD){game.sunooGuilt+=3;game.sunooTension+=2;}
  } else if(s.choiceId===4){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;
  } else if(s.choiceId===5){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;game.smsTarget=ch.sms;
  } else if(s.choiceId===6){
    document.getElementById('scene-container').innerHTML=renderProgress()+'<div id="day-badge">DAY 1</div>'+scenes[game.sceneIndex].render().replace(/<div class="choices">[\s\S]*?<\/div>/,'')+'<div style="text-align:center;margin-top:28px;color:var(--muted);font-size:0.78rem;font-family:var(--font-serif)">感谢试玩 Day 1。<br>完整版请使用 Prompt 在 Claude Code 中继续。</div>';
    return;
  }
  if(game.sceneIndex<totalScenes){game.sceneIndex++;saveGame();renderScene();}
}

function resetGame(){if(confirm('确定要重新开始吗？当前进度将丢失。')){clearSave();location.reload();}}

renderScene();
document.addEventListener('click',function(e){if(e.target.closest('.title-screen')&&game.sceneIndex===0)advanceScene();});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>换乘恋爱 ENHYPEN Edition — Day 1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');
  :root {
    --bg: #07070f; --surface: #0e0e1c; --card: #151528;
    --gold: #c9a96e; --gold-dim: #8a7348; --cream: #f0ebe3; --cream-dim: #9e968a;
    --muted: #55505c; --letter-bg: #18182a; --danger: #a04040;
    --winter-blue: #3a4a5c; --scar-fade: #6b4a4a;
    --font-serif: 'Noto Serif SC','SimSun','STSong',serif;
    --font-sans: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  }
  * { margin:0;padding:0;box-sizing:border-box; }
  body {
    background:var(--bg);color:var(--cream);font-family:var(--font-sans);
    min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
    background-image:radial-gradient(ellipse at 50% 0%,rgba(201,169,110,0.03) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(58,74,92,0.04) 0%,transparent 50%);
  }
  #app { width:100%;max-width:560px;min-height:85vh;position:relative; }
  #scene-container {
    background:var(--surface);border-radius:16px;padding:40px 32px 32px;min-height:500px;
    position:relative;border:1px solid rgba(201,169,110,0.1);
    box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 1px rgba(201,169,110,0.12);
    transition:opacity 0.4s ease,transform 0.4s ease;
  }
  #scene-container.fading { opacity:0;transform:translateY(12px); }
  #progress { display:flex;gap:6px;margin-bottom:24px;align-items:center; }
  #progress .dot { width:5px;height:5px;border-radius:50%;background:var(--muted);transition:all 0.4s ease; }
  #progress .dot.active { background:var(--gold);box-shadow:0 0 6px rgba(201,169,110,0.5);width:7px;height:7px; }
  #progress .dot.done { background:var(--gold-dim); }
  #day-badge { position:absolute;top:16px;right:24px;font-family:var(--font-serif);font-size:0.72rem;letter-spacing:0.18em;color:var(--gold-dim); }
  .scene-label { font-size:0.68rem;letter-spacing:0.22em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;font-weight:500; }
  .scene-text { font-size:0.93rem;line-height:1.95;color:var(--cream-dim);margin-bottom:18px;font-weight:300; }
  .scene-text em { color:var(--cream);font-style:italic; }
  .scene-text strong { color:var(--gold);font-weight:500; }
  .character-name { font-family:var(--font-serif);color:var(--gold);font-weight:600;font-size:0.95rem; }
  .narration { color:var(--cream-dim);font-style:italic;border-left:2px solid var(--gold-dim);padding-left:16px;margin:20px 0;font-size:0.87rem;line-height:1.75; }
  .choices { display:flex;flex-direction:column;gap:10px;margin-top:24px; }
  .choice-btn {
    background:transparent;border:1px solid rgba(201,169,110,0.2);color:var(--cream);
    padding:14px 20px;border-radius:10px;font-family:var(--font-sans);font-size:0.86rem;
    cursor:pointer;text-align:left;transition:all 0.25s ease;line-height:1.55;
    opacity:0;transform:translateY(8px);animation:fadeInUp 0.4s forwards;
  }
  .choice-btn:nth-child(1){animation-delay:0.05s}.choice-btn:nth-child(2){animation-delay:0.12s}
  .choice-btn:nth-child(3){animation-delay:0.19s}.choice-btn:nth-child(4){animation-delay:0.26s}
  @keyframes fadeInUp { to{opacity:1;transform:translateY(0)} }
  .choice-btn:hover { border-color:var(--gold);background:rgba(201,169,110,0.06);box-shadow:0 0 20px rgba(201,169,110,0.08);transform:translateX(3px); }
  .choice-btn:active { background:rgba(201,169,110,0.12);transform:scale(0.985); }
  .choice-btn .choice-letter { color:var(--gold);font-family:var(--font-serif);margin-right:8px;font-weight:600; }
  .choice-btn.locked { opacity:0.35;pointer-events:none;border-color:rgba(255,255,255,0.05); }
  .letter-card {
    background:var(--letter-bg);border-radius:8px;padding:28px 24px;margin:20px 0;
    font-family:var(--font-serif);font-size:0.9rem;line-height:2.1;color:var(--cream);
    border:1px solid rgba(201,169,110,0.12);position:relative;
  }
  .letter-card::before { content:'"';position:absolute;top:6px;left:14px;font-size:3rem;color:rgba(201,169,110,0.06);font-family:var(--font-serif);line-height:1; }
  .sms-notification { background:#12122a;border:1px solid rgba(201,169,110,0.18);border-radius:14px;padding:20px;margin:16px 0;text-align:center;animation:smsPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
  @keyframes smsPop { from{opacity:0;transform:scale(0.9) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .sms-notification .sms-label { font-size:0.68rem;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-bottom:8px; }
  .sms-notification .sms-body { font-family:var(--font-serif);font-size:0.88rem;color:var(--cream);line-height:1.7;margin:12px 0; }
  .sms-notification .sms-result { font-family:var(--font-serif);font-size:1.05rem;color:var(--gold);font-weight:600;margin-top:10px;padding-top:10px;border-top:1px solid rgba(201,169,110,0.1); }
  .sms-result.not-chosen { color:var(--danger); }
  .end-stats { margin:20px 0;padding:20px;background:rgba(201,169,110,0.03);border-radius:10px;border:1px solid rgba(201,169,110,0.08); }
  .end-stats .stat-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted rgba(201,169,110,0.08);font-size:0.83rem;gap:12px;flex-wrap:wrap; }
  .end-stats .stat-row:last-child { border-bottom:none; }
  .end-stats .stat-label { color:var(--cream-dim);flex-shrink:0; }
  .end-stats .stat-value { color:var(--gold);font-weight:500;text-align:right;min-width:0;flex:1; }
  #next-btn { display:block;margin:24px auto 0;background:transparent;border:1px solid rgba(201,169,110,0.25);color:var(--cream-dim);padding:10px 32px;border-radius:20px;font-family:var(--font-sans);font-size:0.78rem;cursor:pointer;transition:all 0.3s ease; }
  #next-btn:hover { border-color:var(--gold);color:var(--cream); }
  .title-screen { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:500px;text-align:center;cursor:pointer; }
  .title-screen .show-title { font-family:var(--font-serif);font-size:2.2rem;color:var(--gold);letter-spacing:0.08em;margin-bottom:6px;font-weight:700; }
  .title-screen .show-subtitle { font-size:0.82rem;color:var(--cream-dim);letter-spacing:0.28em;margin-bottom:40px; }
  .title-screen .start-hint { font-size:0.72rem;color:var(--muted);animation:pulse 2.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }
  .scene-divider { text-align:center;margin:16px 0;color:var(--gold-dim);font-size:0.68rem;letter-spacing:0.3em; }
  .pheromone-hint { display:inline-block;color:var(--gold-dim);font-style:italic;font-size:0.8rem;background:rgba(201,169,110,0.05);padding:2px 10px;border-radius:4px; }
  .pheromone-cold { color:var(--winter-blue);font-style:italic;font-size:0.8rem; }
  .pheromone-hot { color:var(--gold);font-style:italic;font-size:0.8rem; }
  .pill-bottle { display:inline-block;color:var(--scar-fade);font-size:0.8rem;background:rgba(160,64,64,0.08);padding:2px 8px;border-radius:4px;letter-spacing:0.05em; }
  .sunoo-thought { color:var(--gold);font-style:italic;font-size:0.82rem;border-left:1px solid rgba(201,169,110,0.3);padding-left:12px;margin:12px 0; }
  .save-banner { margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap; }
  .save-btn { background:rgba(201,169,110,0.08);border:1px solid var(--gold);color:var(--gold);padding:10px 36px;border-radius:20px;font-family:var(--font-sans);font-size:0.83rem;cursor:pointer; }
  .save-btn-ghost { background:transparent;border:1px solid var(--muted);color:var(--cream-dim);padding:10px 24px;border-radius:20px;font-family:var(--font-sans);font-size:0.8rem;cursor:pointer; }
</style>
</head>
<body>
<div id="app"><div id="scene-container"></div></div>

<script>
const game={
  sunooTension:0, sunghoonWarmth:0, armorCracked:false, smsTarget:null, sceneIndex:0,
  pillExposed:false, scarSeen:false, sunooGuilt:0, pickedHardC:false
};
const totalScenes=10;
const SAVE_KEY='transit-love-d1-v2';
function saveGame(){const d={sunooTension:game.sunooTension,sunghoonWarmth:game.sunghoonWarmth,armorCracked:game.armorCracked,smsTarget:game.smsTarget,sceneIndex:game.sceneIndex,pillExposed:game.pillExposed,scarSeen:game.scarSeen,sunooGuilt:game.sunooGuilt,pickedHardC:game.pickedHardC};localStorage.setItem(SAVE_KEY,JSON.stringify(d));}
function loadGame(){const r=localStorage.getItem(SAVE_KEY);if(!r)return false;const d=JSON.parse(r);Object.assign(game,d);return true;}
function hasSave(){return localStorage.getItem(SAVE_KEY)!==null;}
function clearSave(){localStorage.removeItem(SAVE_KEY);}

const scenes=[

// 0: TITLE
{render(){
  const saveHTML=hasSave()?'<div class="save-banner"><button class="save-btn" onclick="event.stopPropagation();loadGame();renderScene();">继续上次进度</button><button class="save-btn-ghost" onclick="event.stopPropagation();clearSave();renderScene();">重新开始</button></div>':'';
  return '<div class="title-screen" onclick="advanceScene()"><div class="show-subtitle">ENHYPEN EDITION</div><div class="show-title">换乘恋爱</div><div class="show-subtitle" style="margin-top:2px">DAY 1 · 入住日</div><div class="start-hint" style="margin-top:48px">轻触屏幕开始</div>'+saveHTML+'</div>';
}},

// 1: INTRO — winter atmosphere
{render(){return '<div class="scene-label">入住 · 十二月</div>'
+'<div class="scene-text">十二月的首尔。共享屋是一栋浅奶油色的两层别墅，院子里有棵柿子树——光秃秃的，枝丫指着灰白的天空。厨房的中岛台上整整齐齐摆着<span style="color:var(--gold)">八只马克杯</span>，颜色各不相同。风铃在玄关，还没有被碰响过。</div>'
+'<div class="narration">小茶把行李箱拖进房间的时候，左手下意识拢了拢右手腕的袖口。一个习惯。六个月的习惯。</div>'
+'<div class="scene-text"><span class="character-name">韩智恩</span>第一个到。29岁，济州岛来的咖啡店老板。她推开门的瞬间，风铃响了。然后是<span class="character-name">沈载伦</span>——ENHYPEN成员，笑起来总有后半句，韩英双语切换得比别人眨眼还快。再然后是<span class="character-name">崔秀雅</span>和<span class="character-name">梁祯元</span>。秀雅是建筑设计师，祯元是ENHYPEN的队长。四个人礼貌地打过招呼，各自安顿。</div>'
+'<div class="scene-text"><span class="character-name">姜艺琳</span>和<span class="character-name">朴成训</span>先后到达。艺琳是《W Korea》主编，成训是ENHYPEN成员——安静的Alpha，走进客厅像一棵移动的冷杉。他环顾四周的时候，眼睛在暖气片旁边的位置停了一秒——然后移开，像什么都没发生。客厅里六个人了，气氛客气而安静。</div>'
+'<div style="text-align:center;margin-top:24px"><button id="next-btn" onclick="advanceScene()">继续</button></div>';}},

// 2: SUNOO ARRIVES — 小茶视角观察
{render(){return '<div class="scene-label">入住 · 第七位</div>'
+'<div class="scene-text">风铃又响了。</div>'
+'<div class="scene-text"><span class="character-name">金善禹</span>推门进来——然后冬天往后退了一步。</div>'
+'<div class="scene-text">米白色高领毛衣。深蓝色大衣搭在手臂上。刘海比六个月前长了一点，柔软地扫过眉尾。他笑着和大家打招呼——眼睛弯成月牙，然后用手背捂住嘴。那个动作她见过一万次。现在看到，像是有人用指甲在她胸口划了一下——很轻。但划到了旧伤上面。</div>'
+'<div class="scene-text">他在笑。但她看到了。他<span style="color:var(--gold)">瘦了</span>。颧骨的轮廓比以前更分明。他环顾客厅的时候，目光扫过她的方向——</div>'
+'<div class="narration">停了四分之一秒。不到一次眨眼的长度。然后移开。像是她的位置只是一个普通的坐标，和其它七个人没有区别。</div>'
+'<div class="scene-text">但他的<span class="pheromone-hint">雪松威士忌</span>出卖了他。那股本来应该暖而烈的木质调信息素——<strong>比以前淡了</strong>。像是被什么东西稀释过。或者被他自己刻意压低了。她闻得到。她的信息素认得他的。六个月了，还是认得。</div>'
+'<div class="narration">他没有找到他要找的人。第七只杯子——墨绿色的——还在厨房台面上。第八个人还没到。</div>'
+'<div style="text-align:center;margin-top:24px"><button id="next-btn" onclick="advanceScene()">继续</button></div>';}},

// 3: XIAOCHA'S ENTRANCE — Choice 1
{isChoice:true,choiceId:1,
render(){return '<div class="scene-label">入住 · 第八位</div>'
+'<div class="scene-text">门开了。客厅里七个人同时转头。</div>'
+'<div class="scene-text">门口站着一个棕色齐肩短发的女生。黑色高领毛衣，左手腕上叠着两条细细的银手链——刚好遮住了需要遮住的东西。围巾绕了两圈，遮住半张脸。她身后是十二月的冷风和已经黑透了的天。</div>'
+'<div class="scene-text"><span class="character-name">小茶</span>——最后一个入住者。她的视线扫过所有人——每个人脸上一秒——然后停在了<span style="color:var(--gold)">那个人</span>身上。</div>'
+'<div class="scene-text">金善禹站在沙发旁边。他看到她的一瞬间，身体微微往后退了——不是退后，是<strong>晃了一下</strong>。像是被人轻轻推了一把。他的喉结动了。然后他把右手插进口袋——她认得这个动作。他在藏什么。他在藏他指尖的颤抖。</div>'
+'<div class="narration">六个月前。他消失的那个晚上，她给他打了三十二个电话。每一个都响到自动挂断。那之后的一个月，她学会了不打电话。那之后的三个月，她学会了不对着空气说话。那之后的六个月——她站在这里，和他共享着同一间客厅的空气。她的胸口在收紧。但她的脸——她的脸什么都没有表现出来。</div>'
+'<div class="scene-text" style="color:var(--gold);font-weight:500;text-align:center;margin-top:20px">你走进客厅。所有人都在等你开口。</div>';},
choices:[
  {letter:'A',text:'职业微笑。对每个人平等地问候——到善禹的时候，你的声音和问候智恩时一模一样。他只是一个恰好也在房间里的陌生人。',hint:'善禹的表情没有变化。但他的喉结动了第二次。她看到了。她没有给出任何反应。',tension:0,warmth:0},
  {letter:'B',text:'对每个人温暖地笑——但当目光扫到善禹时，笑意刚好凉了三度。不多不少。足够他注意到。足够他明白——你不是忘了。你是记得。记得太清楚了。',hint:'他低下头，用手背碰了碰嘴角。那个她见过一万次的动作——此刻不是习惯，是防线。',tension:2,warmth:0},
  {letter:'C',text:'"成训欧巴！" 第一个招呼给成训，声音轻快得像春天。只在转身的时候，余光轻轻掠过善禹——不是看他，是让他看到你没有在看他。',hint:'善禹的雪松威士忌骤然冷了。他笑了——和所有人一样——但这次他忘了捂嘴。他笑得很完美。完美到碎掉了。',tension:3,warmth:3,hardC:true}
]},

// 4: SETTLING IN — Choice 2 (kitchen)
{isChoice:true,choiceId:2,
render(){const t=game.sunooTension;let extra='';
if(t>=3) extra='<div class="narration">善禹在你进门之后一直没怎么说话。他手里的墨绿色马克杯——水的高度没有变过。他在客厅沙发上坐了一会儿，然后站起来，又坐下，手里折着一张不知道从哪来的纸巾。他的信息素时浓时淡，像是在反复练习怎么呼吸。或者他忘了怎么呼吸。</div>';
else if(t>=2) extra='<div class="narration">善禹安静得不太正常。他的笑比平时快——快得不像是真的。每次笑完就低下头，笑容收得干脆利落，像合上一本读完的书。</div>';
return '<div class="scene-label">安顿 · 厨房</div>'
+'<div class="scene-text">收拾完行李，你走出来倒水。夕阳已经沉到山脊线下面去了，厨房只剩下头顶两盏暖黄的射灯。厨房里只有一个人——<span class="character-name">朴成训</span>，靠在水槽边。他听到脚步声，转过头。然后安静地把你面前的空杯子推近了一点。玻璃杯在台面上滑出两厘米——一个不多不少的、属于朴成训的关怀。</div>'
+'<div class="scene-text">窗外是柿子树光秃秃的轮廓。远处有山的影子。暖气片发出轻微的咔咔声。</div>'+extra;},
choices:[
  {letter:'A',text:'点头道谢。拿杯，倒水，转身——走人。今天不是社交的日子。成训的存在和你无关。',hint:'善禹在走廊另一头。他看着你从厨房出来——路线没有经过他的房间。他低下头，盯着自己手中的杯子。杯子里没有水。',tension:0,warmth:0},
  {letter:'B',text:'"成训欧巴~" 靠在厨房台边，歪头看他。距离刚好——不太近，但绝对不算远。"所以……你是哪种Alpha？"用玩笑的语气，用试探的眼神。',hint:'善禹从走廊经过。他的步伐慢了半拍——正好看到你歪头的样子。然后他加速走了过去。走了。没有看第二眼。',tension:1,warmth:2},
  {letter:'C',text:'站到成训旁边——肩膀差五厘米就碰到了。"上次演唱会……内场第三排。你还记得吗？"你抬头看他。他低你半个头的距离。冷杉和你的信息素在空气里轻轻碰了一下——一种不属于善禹的气味。门外走廊上，雪松威士忌的味道在同一个位置停留了整整三秒。然后才继续移动。',hint:'善禹没有敲门。没有走进来。没有发出任何声音。但他的信息素在门口多留了三秒——那是他今天最诚实的片刻。',tension:2,warmth:3}
]},

// 5: X LETTER — Choice 3
{isChoice:true,choiceId:3,
render(){return '<div class="scene-label">夜晚 · X信件</div>'
+'<div class="scene-text">客厅灯光调暗了。壁炉的仿焰火在每个人脸上跳动——橙色的、柔软的、说谎的光。大家围坐在沙发和地毯上，每人手里一个白色信封。没有署名。只有一张纸的重量。</div>'
+'<div class="scene-text">主持人说明规则：<em>"以\'致我的前任\'开头。不署名。不暴露身份信息。"</em></div>'
+'<div class="scene-divider">✦</div>'
+'<div class="scene-text">艺琳先读了。声线依然精准——但信纸边缘被捏出了细小的皱痕。读完之后她没有看任何人。载伦低下头。智恩的声音是暖的，念了关于济州岛的海风和"比咖啡更好喝的什么"，然后笑了——但载伦看着壁炉，第一次没有笑着接她的话。秀雅念得平稳克制，但祯元在她坐下之后，竹茶信息素软了一瞬。</div>'
+'<div class="scene-divider">✦</div>'
+'<div class="scene-text">主持人看向善禹。<em>"下一位。"</em></div>'
+'<div class="scene-text"><span class="character-name">金善禹</span>站起来的时候，动作慢了半拍。他的手伸进信封——那个白色信封上有你的笔迹。你写的每一个字他马上要读出来。你不知道他会怎么样。你也不知道自己会怎么样。</div>'
+'<div class="narration">他打开了那封信。你的信。他低头看了很久——久到主持人准备提醒他——然后他开始了。</div>'
+'<div class="letter-card">致我的前任：<br><br>我写这封信的时候是十二月初。首尔开始下雪。我站在窗前看雪落在柿子树上——你现在能看到同一棵树。不知道你看到它的时候，会不会想起我。<br><br>我们在一起的时间不长。两个月，六十一天。但很奇怪——有些人在你生命里只待了六十一天，离开的时候却把一整个季节都带走了。我的四月和五月是你。六月是你离开的背影。七月、八月、九月、十月、十一月——是你不在的时候我学会的所有事情。<br><br>我学会了不再给你发消息。我习惯了删掉对话框而不是等回复。我习惯了在咖啡店点单人的量。我习惯了你喜欢的那首歌不再是我的闹钟铃声。我习惯了很多。我习惯不了的是——为什么。<br><br>你走的那天晚上，我给你打了三十二个电话。不是要你回来。只是想知道为什么。你的行李还在我家，你的马克杯还在厨房台面上——那只是便利店买的杯子，十几块钱。我用了两个星期才把它放进柜子最里面。<br><br>你说你不够勇敢。但你知道吗——留下的人需要的勇气不比离开的人少。每天早上醒过来，知道你不会再发消息说"吃饭了吗"，然后还愿意起床——需要勇气。把你的杯子收起来——需要勇气。写这封信——对着白纸一个字一个字地写，像是把愈合了一半的伤口重新撕开——需要勇气。<br><br>但我想让你知道一件事：我不恨你。我以为我会恨你——在我挂断第三十二个电话之后、在我发现自己坐在浴室地板上不知道过了多久之后、在我用袖子遮住了我都不知道是什么的那些痕迹之后——我以为恨是唯一剩下的东西。但我没有。我恨不起来。因为恨一个人需要把所有的回忆都烧掉。而我做不到。我舍不得。<br><br>那些回忆是六十一天里你给我的全部——你笑起来眼睛弯成月牙然后用手背捂住嘴、你叫我名字的时候尾音会微微上扬、我加班到凌晨你发来的那个"知道了，饭在微波炉里"——这些回忆是真的。它们是我弄不坏的东西。<br><br>如果有一天，你准备好告诉我答案了——我在。我不保证我会听。但我在。<br><br>如果那一天永远不会来——那我希望你是幸福的。不是\"因为离开我\"才幸福。只要幸福就够了。<br><br><em>祝你一切都好。</em></div>'
+'<div class="scene-text">善禹念完了。他的声音在前面一直在抖——他试图控制，但有些地方控制不了。念到"三十二个电话"的时候，他停了一下。念到"浴室地板"的时候，他的手把信纸捏出了折痕——那道折痕后来没有消掉。念到"我不保证我会听"的时候——他的声音碎了。只是一瞬。但他碎了。</div>'
+'<div class="scene-text">现在他坐在沙发上，信纸放在膝盖上——没有折起来。他的眼睛很亮。不是哭了。是差一点。他的雪松威士忌在整个房间里扩散——和之前不一样了。不再淡，不再收敛。是烫的。滚烫的。像是有人打翻了一杯威士忌，酒精泼在壁炉边上，烧起来了。</div>'
+'<div class="narration">他在看你。第一次——今天第一次，他直视了你。没有移开。没有用余光。他的眼睛在问一个问题。不是"你还好吗"。不是"对不起"。是更简单的——<strong>"你写的这些——是真的吗？你还愿意听吗？"</strong></div>'
+'<div class="scene-divider">✦</div>'
+'<div class="scene-text">现在轮到你了。</div>'
+'<div class="scene-text">你打开信封。纸上是善禹的笔迹。你认得——每一个弯钩，每一笔收尾。他写"爱"字的时候，最后一点总是特别轻，像是怕弄疼了纸。你认得。六个月了——你认得。</div>'
+'<div class="narration">她的手有一点抖。不是因为紧张——是因为她已经六个月没有在这么近的距离看到他的笔迹了。也因为刚才他念她写的信的时候，她的盔甲差点碎了。现在轮到她。轮到她对着所有人——对着他——念出他写了什么。左手下意识地握住了右手腕。两条银手链下面——是淡去的、白色的线。</div>'
+'<div class="letter-card">致我的前任：<br><br>现在是凌晨三点。我写了很多遍。每一遍都不对。不是字不好看——我的字从来就不好看，你总说像小学生写的。不对的是我不知道从哪里开始。<br><br>从哪里开始呢。从第一次见到你那天——你穿着一件驼色大衣，在咖啡店里对着电脑皱眉。你抬头的那一眼不是看我，是看门口的方向，只是我刚好在那里。但你的眼睛在那个瞬间被夕阳照得很亮。后来我知道那是角度。但我每次想起那天，都还是觉得你眼睛里的光是为我亮的。<br><br>和你在一起的每一天，我都记得。记得你早上起床第一件事是摸手机——不是刷消息，是看时间。你总是很准时，除了约会的日子。约会的时候你会迟到十分钟，因为你在衣柜前面站了半小时，最后穿了我们第一次见面的那件驼色大衣。你以为我不知道。我知道。我知道你很多事。<br><br>我知道你加班的时候会忘记吃饭——不是真的忘记，是懒得去热。所以我才一直给你发"吃饭了吗"。那不是唠叨。那是我隔着半个城市能给你的唯一的东西。我知道你生气的时候嘴巴会说很难听的话——但你的手在抖。你以为你在推开我，但你的手每次都在说相反的话。我知道你不喜欢自己的信息素——你说它太淡了，不像别人的信息素那么浓烈。但它就是你的味道。我第一次闻到的时候，就觉得安心。不是信息素契合——是别的什么。是比信息素更深的什么。是你在的时候，什么都不用怕。<br><br>对不起——这三个字我写得很慢。不是羞耻。是太重了。<br><br>对不起，那天晚上我没有接你的电话。你打了三十二次。我都看到了。每一次手机震动的时候，我都盯着屏幕亮起来——你的名字，然后暗下去。然后亮起来，又暗下去。三十二次。我的手指在接听键上面悬了不止三十二次。但我没有按下去。不是不想。是太想了——想到我不敢。我怕我一听到你的声音，就会跑回去。那时候的我觉得自己不能。我不够勇敢。这是我能给你的唯一的解释。它不够好——我知道不够好。但它是我全部的事实。<br><br>那天晚上我没有睡。第二天也没有。之后的很多天都没有。我躺在黑暗里，想你说过的每一句话，想我有没有好好回答过你——大部分时候没有。我后悔了。不是后悔离开。我离开不是因为不爱你。我离开是因为我害怕——怕我不够好，怕我伤害你，怕你有一天会后悔选择了和我在一起。所以我先走了。我以为这样你会少受一点伤。现在回头看看——我可能是那个用最笨的方式，伤你最深的人。<br><br>你教会我很多事。你教会我被一个人真心喜欢是什么感觉。不是信息素的吸引，不是出于习惯的靠近。是你熬夜到三点还不忘回我一句"晚安"。是你用嫌弃的语气说"你的字怎么越来越丑了"，然后把我写的便利贴收进抽屉最里面。是你明明很累了，还愿意听我讲今天练习室发生的事——那些事和你没有关系。但你都听了。你全都听了。<br><br>我没有什么资格请求什么。但如果你看到这封信的时候，我还在你面前——不。我不确定我还有没有勇气站在你面前。但如果你看到这封信的时候，我还能看到你——哪怕只是侧脸、背影、或者桌子的对面——我会告诉自己：这一次，不要逃。<br><br><em>谢谢你曾经爱过我。<br>谢谢你让我写这封信。</em></div>'
+'<div class="scene-text">客厅里安静到了极致。连壁炉的仿焰火都像屏住了呼吸。没有人动。没有人说话。七双眼睛看着你。但斜对角有一双眼睛——热得像要透过信纸烧到你的手指上。你没有抬头。但你知道是谁。你从头到尾都知道。你刚刚听了他念你写的每一个字——你也听了他声音碎掉的那个瞬间。现在轮到你念他的。只是念。只是把每一个字念出来。只是——</div>';},

{letter:'D',text:'拆开信，看了一眼。折好。放回信封。"我读不了。" 声音很平。然后起身——没有看任何人——走向洗手间。门关上了。水龙头开了。很久。',hint:'善禹的信息素几乎消失了。他盯着你留在沙发上的空信封，眼睛里有一种恐惧——他第一次意识到：他可能已经弄坏了一些修不好的东西。',cracked:false,tension:4,hiddenD:true,needHardC:true}

  +'<div class="narration">你的短信飞向了另一个人。但X的短信还是穿过来了——穿过你的冷漠、穿过你对别人说的话、穿过你今晚在厨房门口多停的那三秒。他选了。他不知道你也在选——或者说，他只能猜。但他还是发了。成训收到了你的短信。善禹把短信发给了你。你收到了一条你没在等的消息。这就是换乘恋爱。不是谁选了谁的问题。是谁敢选，谁不敢。</div>';

} else if(to==='none'&&sunooSentToHer){
  smsSection='<div class="sms-notification"><div class="sms-label">📩 收到一条匿名短信</div><div class="sms-body">"你的声音没有变。念那封信的时候……谢谢你读完了它。"</div><div class="sms-result">你的X选择了你</div></div>'
  +'<div class="narration">你选择了沉默。但他没有。在他不知道你会不会选他的时候——他还是选了。雪松威士忌从门缝里渗进来。隔壁房间。很近。他没有敲门。你也没有开门。但你们之间隔着的——已经不是六个月的空白和不告而别的重量了。是比那个更复杂的东西。是沉默在互相回答。</div>';
} else {
  resultClass='not-chosen';
  smsSection='<div class="sms-notification"><div class="sms-label">📩 没有收到短信</div><div class="sms-result not-chosen">你的X没有选择你</div></div>'
  +'<div class="narration">两个人都沉默了。沉默是今晚的主题。沉默占据了这栋房子、这六个月的空白、以及两条都没有发出的短信。沉默不会说谎——但沉默也不会给答案。你躺下来。天花板是陌生的。旁边的房间也是陌生的。一切都是陌生的——除了雪松威士忌的残留，在你的嗅觉记忆里，没有淡过。</div>';
}
const gazeCount=(t>=4?'很多次。他看你的次数比看任何其他人都多。但你一次都没有回看他。至少——他以为你没有。':(t>=2?'几次。每次都很短。但每次都很重。像是他的目光有重量——放在你身上，然后很快移开，像是怕烫到你。':'不多。但他知道你在哪里。从头到尾都知道。从头到尾。'));
const warmthDesc=(game.sunghoonWarmth>=4?'很高。你今晚主动接近了他。他感觉到了。善禹也感觉到了。':(game.sunghoonWarmth>=2?'温和。成训记得你的名字了。你们之间开了一个只有你们知道的玩笑。明天这个玩笑还会继续。':'普通。点头之交。一杯水的距离。'));
const armorDesc=(cracked?'裂了一道缝。很小。但斜对面的那个人看到了。他没有说。但他的信息素变了。':'完好。但它很重。重到你需要安眠药才能入睡。');
const jakePill=(game.pillExposed?'他在走廊里停了。他没有敲门。但他知道了什么。':'他不知道。今晚还不知道。但这座房子很小。秘密不会永远是秘密。');
return '<div class="scene-label">深夜 · 后采</div><div class="scene-text">单人沙发。对面是一台固定摄像机。红色的录制灯亮着——一颗不会眨眼的红点。你坐着。左手握着右手腕。是下意识的。是每天都在做的。</div><div class="scene-text">"第一天结束了。你觉得怎么样？"</div>'+smsSection
+'<div class="end-stats"><div style="text-align:center;font-family:var(--font-serif);color:var(--gold);margin-bottom:12px">录制日记 · DAY 1</div>'
+'<div class="stat-row"><span class="stat-label">善禹的目光落在你身上</span><span class="stat-value">'+gazeCount+'</span></div>'
+'<div class="stat-row"><span class="stat-label">成训与你互动的温度</span><span class="stat-value">'+warmthDesc+'</span></div>'
+'<div class="stat-row"><span class="stat-label">你的盔甲</span><span class="stat-value">'+armorDesc+'</span></div>'
+'<div class="stat-row"><span class="stat-label">他发现药瓶了吗</span><span class="stat-value">'+jakePill+'</span></div>'
+'<div class="stat-row"><span class="stat-label">明天的第一次约会</span><span class="stat-value">你不能选择X。</span></div></div>'
+'<div class="scene-divider" style="margin-top:24px">✦</div>'
+'<div class="scene-text" style="text-align:center;color:var(--cream-dim)">DAY 1 结束。<br>第二天的太阳会照常升起。<br>柿子树还是秃的。风铃还会响。<br><em>但树根在地下的部分——没有人看到的部分——还活着。</em></div>';},
choices:[
  {letter:'A',text:'"我做对了吗？"——对着摄像机，也对着空气。不确定。不安。但今晚已经结束了。药效开始发作了。',hint:'',final:true},
  {letter:'B',text:'"他的字还是那么丑。"——说完自己笑了一下。然后收起了笑容。手指在右手腕上轻轻画着圈——一个她自己都不知道在做的小动作。',hint:'',final:true},
  {letter:'C',text:'"明天……是新的一天。"——深呼吸。把信纸放进抽屉最底层。然后把手链重新戴回左手腕。关灯。黑暗里只有暖气片的咔咔声。',hint:'',final:true},
  {letter:'D',text:'[什么都不说。关灯。蜷进被子里。]——窗外的柿子树在风里轻轻晃了一下。它没有叶子可以掉。它已经什么都没有了。',hint:'',final:true}
]},

// 10: SUNOO'S POV — epilogue
{render(){const t=game.sunooTension;let thought='';
if(t>=4) thought='他在想她今晚没有读的信。他在想她站起来的时候——那么轻，那么稳——然后洗手间的门关上的声音。他在想：<strong>是不是来不及了。</strong>他不确定自己做错了什么。六月的那个晚上他离开了。但他不知道自己离开之后发生了什么。今晚的他开始意识到——他可能需要知道。';
else if(t>=2) thought='他在想她对他笑的时差。对别人是即时的——对他慢了半秒。那半秒里有什么？他在想：她身上有一种从前没有的东西。一种被什么伤害过之后，小心翼翼收拢起来的锋利。他不是受害者。他好像是那把刀。';
else thought='她在读信的时候声音没有变。一个字都没有变。她在晚餐的时候没有看他——一次都没有。她今晚发的短信不是给他的。他在想——她是不是真的走出来了。他在想——这难道不是他当初希望的结果吗？但他不记得自己希望过这个。';
return '<div class="scene-divider">—— 同一时刻，另一个房间 ——</div>'
+'<div class="scene-text"><span class="character-name">金善禹</span>坐在床边。没有开灯。窗外有远处城市的微弱光线，把他的轮廓描了一圈灰蓝色的边。他手里是一个空白日记本。打开了。什么都没写。笔放在旁边。帽没有摘。</div>'
+'<div class="scene-text">他的<span class="pheromone-hint">雪松威士忌</span>在黑暗里安静地扩散——终于不再是刻意压低的。现在没有人闻得到。他可以不用控制。信息素在房间里沉着、沉着——然后某一刻突然乱了。像是有人搅动了一杯本该平静的酒。</div>'
+'<div class="sunoo-thought">'+thought+'</div>'
+'<div class="scene-text">他把日记本合上。躺下来。天花板是陌生的。和她共享了这栋房子的空气，共度了12个小时——最近的时候隔着一张长餐桌，最远的时候隔着客厅和走廊。最近的时候隔着两扇门和一个走廊。最远的时候隔着他六月离开的那个晚上和今天。</div>'
+'<div class="narration">柿子树在窗外。光秃秃的。但根在地下——树不知道自己的根还活着。要等到春天才会知道。</div>'
+'<div style="text-align:center;margin-top:24px;color:var(--muted);font-size:0.76rem">感谢试玩 Day 1。<br>完整版请使用 Prompt 在 Claude Code 中继续。</div>';}}
];

function renderProgress(){
  let h='<div id="progress" style="display:flex;justify-content:space-between;align-items:center">';
  h+='<div style="display:flex;gap:5px;align-items:center">';
  for(let i=0;i<=totalScenes;i++){
    let c='';if(i<game.sceneIndex)c='done';else if(i===game.sceneIndex)c='active';
    h+='<div class="dot '+c+'"></div>';
  }
  h+='</div>';
  if(game.sceneIndex>0&&game.sceneIndex<totalScenes) h+='<button onclick="resetGame()" style="background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--muted);padding:3px 10px;border-radius:10px;font-size:0.62rem;cursor:pointer;font-family:var(--font-sans)">重新开始</button>';
  h+='</div>';return h;
}

function renderScene(){
  const c=document.getElementById('scene-container'),s=scenes[game.sceneIndex];
  c.classList.add('fading');
  setTimeout(()=>{
    let h=renderProgress()+'<div id="day-badge">DAY 1</div>';
    h+=s.render();
    if(s.isChoice){
      h+='<div class="choices">';
      const filteredChoices=s.choices.filter(ch=>!ch.needHardC||game.pickedHardC);
      filteredChoices.forEach((ch,i)=>{
        h+='<button class="choice-btn" onclick="makeChoice('+i+')"><span class="choice-letter">'+ch.letter+'</span>'+ch.text+'<br><small style="color:var(--cream-dim);font-size:0.75rem">'+ch.hint+'</small></button>';
      });
      // Store filtered choices for makeChoice to use
      s._filteredChoices=filteredChoices;
      h+='</div>';
    }
    c.innerHTML=h;c.classList.remove('fading');
  },300);
}

function advanceScene(){
  if(game.sceneIndex<totalScenes){game.sceneIndex++;saveGame();renderScene();}
}

function makeChoice(idx){
  const s=scenes[game.sceneIndex]; if(!s||!s.choices)return;
  const ch=(s._filteredChoices||s.choices)[idx];
  if(!ch)return;
  if(s.choiceId===1){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;
    if(ch.hardC)game.pickedHardC=true;
  } else if(s.choiceId===2){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;
  } else if(s.choiceId===3){
    game.armorCracked=ch.cracked;game.sunooTension+=ch.tension;
    if(ch.hiddenD){game.sunooGuilt+=3;game.sunooTension+=2;}
  } else if(s.choiceId===4){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;
  } else if(s.choiceId===5){
    game.sunooTension+=ch.tension;game.sunghoonWarmth+=ch.warmth;game.smsTarget=ch.sms;
  } else if(s.choiceId===6){
    document.getElementById('scene-container').innerHTML=renderProgress()+'<div id="day-badge">DAY 1</div>'+scenes[game.sceneIndex].render().replace(/<div class="choices">[\s\S]*?<\/div>/,'')+'<div style="text-align:center;margin-top:28px;color:var(--muted);font-size:0.78rem;font-family:var(--font-serif)">感谢试玩 Day 1。<br>完整版请使用 Prompt 在 Claude Code 中继续。</div>';
    return;
  }
  if(game.sceneIndex<totalScenes){game.sceneIndex++;saveGame();renderScene();}
}

function resetGame(){if(confirm('确定要重新开始吗？当前进度将丢失。')){clearSave();location.reload();}}

renderScene();
document.addEventListener('click',function(e){if(e.target.closest('.title-screen')&&game.sceneIndex===0)advanceScene();});
</script>
